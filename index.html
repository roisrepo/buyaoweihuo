<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="约稿管家">
<meta name="theme-color" content="#f2f2f7">
<meta name="format-detection" content="telephone=no">
<title>约稿尾款管家</title>
<style>
/* ============================================================
   约稿尾款管家 V13
   主题系统：所有颜色走 CSS 变量，data-theme 切换
   ============================================================ */
:root{
  /* ---- 极简白（默认） ---- */
  --bg:#f2f2f7; --bg-image:none;
  --surface:#ffffff; --surface-2:#f2f2f7; --surface-3:#e9e9ee;
  --border:#e3e3e8; --border-soft:#f0f0f3;
  --text:#1d1d1f; --text-mid:#6e6e73; --text-dim:#8e8e93;
  --accent:#5856d6; --accent-light:#7a78e8; --accent-soft:rgba(88,86,214,.10);
  --accent-glow:rgba(88,86,214,.28); --on-accent:#ffffff;
  --green:#1f9e57; --green-soft:rgba(31,158,87,.10);
  --orange:#c97800; --orange-soft:rgba(201,120,0,.10);
  --red:#d92f26; --red-soft:rgba(217,47,38,.08);
  --tabbar:rgba(255,255,255,.82); --sheet-bg:#ffffff; --scrim:rgba(0,0,0,.36);
  --shadow-sm:0 1px 3px rgba(0,0,0,.05),0 1px 2px rgba(0,0,0,.03);
  --shadow-md:0 6px 20px rgba(0,0,0,.07);
  --shadow-lg:0 12px 40px rgba(0,0,0,.10);
  --glass-blur:blur(0px);
  --field-bg:var(--surface-2); --field-border:transparent;
  --radius:16px; --tab-h:58px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}

/* ---- 薄巧（薄荷 + 巧克力） ---- */
html[data-theme="mintchoco"]{
  --bg:#f3f7f2; --bg-image:linear-gradient(165deg,#e6f4ec 0%,#f7f4ea 52%,#eaf3ee 100%);
  --surface:rgba(255,255,255,.80); --surface-2:rgba(255,255,255,.58); --surface-3:rgba(255,255,255,.92);
  --border:rgba(58,43,35,.08); --border-soft:rgba(58,43,35,.05);
  --text:#3a2b23; --text-mid:#6d5b4f; --text-dim:#93857a;
  --accent:#2a8f6f; --accent-light:#37a883; --accent-soft:rgba(42,143,111,.12);
  --accent-glow:rgba(42,143,111,.26); --on-accent:#ffffff;
  --green:#2f9e6e; --green-soft:rgba(47,158,110,.13);
  --orange:#a86b28; --orange-soft:rgba(168,107,40,.13);
  --red:#bf4f45; --red-soft:rgba(191,79,69,.10);
  --tabbar:rgba(255,255,255,.72); --sheet-bg:rgba(255,255,255,.94); --scrim:rgba(46,34,28,.38);
  --shadow-sm:0 4px 18px rgba(58,43,35,.06);
  --shadow-md:0 10px 32px rgba(58,43,35,.09);
  --shadow-lg:0 16px 44px rgba(58,43,35,.12);
  --glass-blur:blur(20px) saturate(1.6);
}

/* ---- 海盐 ---- */
html[data-theme="sea"]{
  --bg:#f1f6fa; --bg-image:linear-gradient(170deg,#e8f2fa 0%,#f4f8fb 55%,#eaf4f7 100%);
  --surface:rgba(255,255,255,.82); --surface-2:rgba(255,255,255,.6); --surface-3:rgba(255,255,255,.95);
  --border:rgba(27,39,51,.08); --border-soft:rgba(27,39,51,.05);
  --text:#1b2733; --text-mid:#5d7183; --text-dim:#8798a8;
  --accent:#2b76c9; --accent-light:#4a93e0; --accent-soft:rgba(43,118,201,.11);
  --accent-glow:rgba(43,118,201,.25); --on-accent:#ffffff;
  --green:#1c9a72; --green-soft:rgba(28,154,114,.11);
  --orange:#c07a1e; --orange-soft:rgba(192,122,30,.11);
  --red:#cf4438; --red-soft:rgba(207,68,56,.09);
  --tabbar:rgba(255,255,255,.74); --sheet-bg:rgba(255,255,255,.95); --scrim:rgba(20,32,44,.36);
  --shadow-sm:0 4px 18px rgba(27,39,51,.06);
  --shadow-md:0 10px 32px rgba(27,39,51,.09);
  --shadow-lg:0 16px 44px rgba(27,39,51,.12);
  --glass-blur:blur(20px) saturate(1.6);
}

/* ---- 蜜桃乌龙 ---- */
html[data-theme="peach"]{
  --bg:#fdf4ef; --bg-image:linear-gradient(170deg,#fdeee6 0%,#fdf6f1 55%,#fbeae2 100%);
  --surface:rgba(255,255,255,.84); --surface-2:rgba(255,255,255,.6); --surface-3:rgba(255,255,255,.95);
  --border:rgba(58,42,34,.08); --border-soft:rgba(58,42,34,.05);
  --text:#3a2a22; --text-mid:#7a6357; --text-dim:#a08d82;
  --accent:#c9613c; --accent-light:#dd7c57; --accent-soft:rgba(201,97,60,.11);
  --accent-glow:rgba(201,97,60,.25); --on-accent:#ffffff;
  --green:#2f9e6e; --green-soft:rgba(47,158,110,.11);
  --orange:#c07f22; --orange-soft:rgba(192,127,34,.12);
  --red:#c8453a; --red-soft:rgba(200,69,58,.09);
  --tabbar:rgba(255,255,255,.75); --sheet-bg:rgba(255,255,255,.95); --scrim:rgba(58,42,34,.36);
  --shadow-sm:0 4px 18px rgba(58,42,34,.06);
  --shadow-md:0 10px 32px rgba(58,42,34,.09);
  --shadow-lg:0 16px 44px rgba(58,42,34,.12);
  --glass-blur:blur(20px) saturate(1.6);
}

/* ---- 抹茶拿铁 ---- */
html[data-theme="matcha"]{
  --bg:#f5f6ee; --bg-image:linear-gradient(170deg,#eef1e2 0%,#f8f7f0 55%,#edf2e4 100%);
  --surface:rgba(255,255,255,.84); --surface-2:rgba(255,255,255,.6); --surface-3:rgba(255,255,255,.95);
  --border:rgba(47,53,36,.09); --border-soft:rgba(47,53,36,.05);
  --text:#2f3524; --text-mid:#6b7259; --text-dim:#949a82;
  --accent:#5f8437; --accent-light:#779a4c; --accent-soft:rgba(95,132,55,.12);
  --accent-glow:rgba(95,132,55,.25); --on-accent:#ffffff;
  --green:#2f9e6e; --green-soft:rgba(47,158,110,.11);
  --orange:#b57f26; --orange-soft:rgba(181,127,38,.12);
  --red:#bf4a42; --red-soft:rgba(191,74,66,.09);
  --tabbar:rgba(255,255,255,.75); --sheet-bg:rgba(255,255,255,.95); --scrim:rgba(47,53,36,.36);
  --shadow-sm:0 4px 18px rgba(47,53,36,.06);
  --shadow-md:0 10px 32px rgba(47,53,36,.09);
  --shadow-lg:0 16px 44px rgba(47,53,36,.12);
  --glass-blur:blur(20px) saturate(1.6);
}

/* ---- 薰衣草 ---- */
html[data-theme="lavender"]{
  --bg:#f5f3fb; --bg-image:linear-gradient(170deg,#efeafa 0%,#f8f5fd 55%,#eee9fa 100%);
  --surface:rgba(255,255,255,.84); --surface-2:rgba(255,255,255,.6); --surface-3:rgba(255,255,255,.95);
  --border:rgba(43,37,64,.08); --border-soft:rgba(43,37,64,.05);
  --text:#2b2540; --text-mid:#645c80; --text-dim:#8d87a3;
  --accent:#6a55c9; --accent-light:#8574dd; --accent-soft:rgba(106,85,201,.11);
  --accent-glow:rgba(106,85,201,.25); --on-accent:#ffffff;
  --green:#2f9e6e; --green-soft:rgba(47,158,110,.11);
  --orange:#c08420; --orange-soft:rgba(192,132,32,.12);
  --red:#c94a5c; --red-soft:rgba(201,74,92,.09);
  --tabbar:rgba(255,255,255,.75); --sheet-bg:rgba(255,255,255,.95); --scrim:rgba(43,37,64,.36);
  --shadow-sm:0 4px 18px rgba(43,37,64,.06);
  --shadow-md:0 10px 32px rgba(43,37,64,.09);
  --shadow-lg:0 16px 44px rgba(43,37,64,.12);
  --glass-blur:blur(20px) saturate(1.6);
}

/* ---- 樱花 ---- */
html[data-theme="sakura"]{
  --bg:#fdf3f5; --bg-image:linear-gradient(170deg,#fce8ee 0%,#fdf6f8 55%,#fbe6ec 100%);
  --surface:rgba(255,255,255,.84); --surface-2:rgba(255,255,255,.6); --surface-3:rgba(255,255,255,.95);
  --border:rgba(58,38,48,.08); --border-soft:rgba(58,38,48,.05);
  --text:#3a2630; --text-mid:#7d5f6b; --text-dim:#a38e97;
  --accent:#c94a76; --accent-light:#dd6a92; --accent-soft:rgba(201,74,118,.11);
  --accent-glow:rgba(201,74,118,.25); --on-accent:#ffffff;
  --green:#2f9e6e; --green-soft:rgba(47,158,110,.11);
  --orange:#c07f22; --orange-soft:rgba(192,127,34,.12);
  --red:#cf3b52; --red-soft:rgba(207,59,82,.09);
  --tabbar:rgba(255,255,255,.75); --sheet-bg:rgba(255,255,255,.95); --scrim:rgba(58,38,48,.36);
  --shadow-sm:0 4px 18px rgba(58,38,48,.06);
  --shadow-md:0 10px 32px rgba(58,38,48,.09);
  --shadow-lg:0 16px 44px rgba(58,38,48,.12);
  --glass-blur:blur(20px) saturate(1.6);
}

/* ---- 深夜 ---- */
html[data-theme="night"]{
  --bg:#13141c; --bg-image:linear-gradient(170deg,#16171f 0%,#101119 100%);
  --surface:#1b1d28; --surface-2:#232634; --surface-3:#2b2f42;
  --border:#2e3245; --border-soft:#242838;
  --text:#e6e8f2; --text-mid:#a9b0c8; --text-dim:#7f87a3;
  --accent:#7aa2f7; --accent-light:#9bb8ff; --accent-soft:rgba(122,162,247,.16);
  --accent-glow:rgba(0,0,0,.55); --on-accent:#10121a;
  --green:#9ece6a; --green-soft:rgba(158,206,106,.14);
  --orange:#e0af68; --orange-soft:rgba(224,175,104,.14);
  --red:#f7768e; --red-soft:rgba(247,118,142,.14);
  --tabbar:rgba(19,20,28,.84); --sheet-bg:#1b1d28; --scrim:rgba(0,0,0,.6);
  --shadow-sm:0 1px 3px rgba(0,0,0,.4);
  --shadow-md:0 6px 20px rgba(0,0,0,.45);
  --shadow-lg:0 12px 40px rgba(0,0,0,.55);
  --glass-blur:blur(0px);
}

/* 毛玻璃主题的输入框底色（半透明卡片上需要一点实色，否则看不出输入框） */
html[data-theme="mintchoco"],html[data-theme="sea"],html[data-theme="peach"],
html[data-theme="matcha"],html[data-theme="lavender"],html[data-theme="sakura"]{
  --field-bg:rgba(255,255,255,.62);
  --field-border:rgba(0,0,0,.075);
}
html[data-theme="night"]{ --field-bg:#232634; --field-border:#2e3245; }

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}html{-webkit-text-size-adjust:100%;overscroll-behavior:none;background:var(--bg);overflow-x:clip;}
html,body{min-height:100%;max-width:100%;overflow-x:clip;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  color:var(--text);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
  touch-action:pan-y;
}
body::before{
  content:'';position:fixed;inset:0;z-index:0;
  background-color:var(--bg);background-image:var(--bg-image);background-size:cover;background-position:center;
  transition:background-color .35s ease;
}
input,textarea,button,select{font-family:inherit;}
input,textarea{-webkit-user-select:text;user-select:text;}

/* ===== App Shell ===== */
#app{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column;}

.top-bar{
  flex-shrink:0;position:sticky;top:0;z-index:50;
  padding:calc(var(--safe-top) + 10px) 18px 10px;
  background:transparent;
  transition:background .25s,box-shadow .25s,backdrop-filter .25s;
}
.top-bar.scrolled{
  background:var(--tabbar);
  backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);
  box-shadow:0 1px 0 var(--border-soft);
}
.top-bar h1{font-size:28px;font-weight:800;letter-spacing:-.7px;line-height:1.2;}
.top-bar h1 .accent{color:var(--accent);}
.top-bar .subtitle{font-size:13px;color:var(--text-dim);margin-top:2px;}
.tb-actions{display:flex;gap:8px;flex-shrink:0;}
.icon-btn{
  width:38px;height:38px;border:none;border-radius:50%;
  background:var(--surface);color:var(--text);
  font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:var(--shadow-sm);transition:transform .12s,background .2s;
}
.icon-btn:active{transform:scale(.9);}

/* ===== 底部导航栏 ===== */
.tab-bar{
  position:fixed;left:0;right:0;bottom:0;z-index:100;
  display:flex;align-items:stretch;
  max-width:500px;margin:0 auto;
  height:calc(var(--tab-h) + var(--safe-bottom));
  padding-bottom:var(--safe-bottom);
  background:var(--tabbar);
  backdrop-filter:blur(20px) saturate(1.8);-webkit-backdrop-filter:blur(20px) saturate(1.8);
  box-shadow:0 -1px 0 var(--border-soft),0 -8px 24px rgba(0,0,0,.04);
}
.tab-btn{
  flex:1;min-width:0;position:relative;
  border:none;background:transparent;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:6px 2px 7px;
  color:var(--text-dim);font-size:10.5px;font-weight:600;letter-spacing:.2px;
  transition:color .18s ease,transform .14s ease;
  -webkit-user-select:none;user-select:none;
}
.tab-btn .tab-icon{
  display:flex;align-items:center;justify-content:center;
  width:46px;height:26px;border-radius:13px;
  font-size:17px;line-height:1;
  filter:grayscale(.55);opacity:.72;
  transition:background .22s ease,transform .24s cubic-bezier(.34,1.56,.64,1),filter .22s ease,opacity .22s ease;
}
.tab-btn.active{color:var(--accent);}
.tab-btn.active .tab-icon{
  background:var(--accent-soft);
  filter:none;opacity:1;
  transform:translateY(-1px) scale(1.06);
}
.tab-btn:active{transform:scale(.92);}
.tab-btn:active .tab-icon{filter:none;opacity:1;}

.content{flex:1;padding:0 16px calc(var(--tab-h) + var(--safe-bottom) + 28px);}
.content.has-fab{padding-bottom:calc(var(--tab-h) + var(--safe-bottom) + 92px);}.view{display:none;}
.view.active{display:block;animation:viewIn .26s cubic-bezier(.32,.72,0,1);}
@keyframes viewIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

/* ===== Cards 通用毛玻璃 ===== */
.stat-card,.comm-card,.schedule-item,.calc-card,.pressure-card,.gcard,.trend-card,
.month-section,.chip,.nav-arrow,.search-input,.icon-btn,.seg-control,.s-item,.theme-card{
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
}

/* ===== Stat ===== */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;}
.stat-card{
  background:var(--surface);border-radius:var(--radius);padding:16px;
  position:relative;overflow:hidden;box-shadow:var(--shadow-sm);
}
.stat-card::before{content:'';position:absolute;top:0;left:0;width:100%;height:3px;background:var(--accent);}
.stat-card.green::before{background:var(--green);}
.stat-card.orange::before{background:var(--orange);}
.stat-card.red::before{background:var(--red);}
.stat-label{font-size:12px;color:var(--text-dim);margin-bottom:6px;font-weight:500;}
.stat-value{font-size:21px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums;}
.stat-value.v-orange{color:var(--orange);}
.stat-value.v-green{color:var(--green);}
.stat-value.v-accent{color:var(--accent);}
.stat-sub{font-size:11px;color:var(--text-dim);margin-top:4px;}

/* ===== Section ===== */
.section{margin-top:26px;}
.section-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;padding:0 4px;}
.section-header h2{font-size:17px;font-weight:700;white-space:nowrap;}
.sh-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.btn-order{padding:0 10px;font-size:12px;font-weight:600;letter-spacing:.2px;min-width:0;}

/* ===== Commission Card ===== */
.comm-card{
  background:var(--surface);border-radius:var(--radius);padding:15px 16px;
  margin-bottom:10px;box-shadow:var(--shadow-sm);
  transition:transform .14s,opacity .2s;
}
.comm-card:active{transform:scale(.985);}
.cc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.cc-title{font-size:16px;font-weight:600;line-height:1.35;}
.cc-artist{font-size:12.5px;color:var(--text-dim);margin-top:3px;}
.cc-money{text-align:right;flex-shrink:0;}
.cc-rem{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.3px;}
.cc-rem.pending{color:var(--orange);}
.cc-rem.unpaid{color:var(--red);}
.cc-rem.done{color:var(--green);}
.cc-sub{font-size:11px;color:var(--text-dim);margin-top:1px;}
.cc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px;}
.cc-more{
  border:none;background:transparent;color:var(--text-dim);
  font-size:20px;line-height:1;width:34px;height:30px;border-radius:9px;
  cursor:pointer;flex-shrink:0;
}
.cc-more:active{background:var(--surface-2);color:var(--text);}

.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;}
.tag-pending{background:var(--orange-soft);color:var(--orange);}
.tag-unpaid{background:var(--red-soft);color:var(--red);}
.tag-done{background:var(--green-soft);color:var(--green);}
/* 「已搁置」：和付款/绘制状态是两回事，单独一个中性色小标签 */
.tag-stall{background:var(--surface-3);color:var(--text-dim);margin-left:6px;}
.tag-info{background:var(--accent-soft);color:var(--accent);}

.progress-row{display:flex;align-items:center;gap:3px;margin-top:10px;flex-wrap:wrap;}
.pdot{width:11px;height:11px;border-radius:50%;border:2px solid var(--border);background:transparent;flex-shrink:0;padding:0;cursor:pointer;}
.pdot.done{background:var(--green);border-color:var(--green);}
.pline{width:14px;height:2px;background:var(--border);flex-shrink:0;}
.pline.done{background:var(--green);}
.progress-labels{font-size:11px;color:var(--text-dim);margin-top:5px;line-height:1.5;}

/* ===== Buttons ===== */
.btn{
  border:none;border-radius:12px;cursor:pointer;font-size:15px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:44px;padding:0 18px;transition:transform .12s,background .18s,opacity .18s;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--accent);color:var(--on-accent);box-shadow:0 3px 12px var(--accent-glow);}
.btn-ghost{background:var(--surface-3);color:var(--text);}
.btn-danger{background:var(--red-soft);color:var(--red);}
.btn-sm{min-height:34px;padding:0 14px;font-size:13px;border-radius:10px;}
.btn-block{width:100%;}
.btn[disabled]{opacity:.45;pointer-events:none;}

.fab{
  position:fixed;bottom:calc(var(--tab-h) + var(--safe-bottom) + 18px);right:20px;
  width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--on-accent);
  border:none;font-size:27px;font-weight:300;line-height:1;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 6px 20px var(--accent-glow);z-index:60;
  transition:transform .16s cubic-bezier(.34,1.56,.64,1),opacity .2s;
}
.fab:active{transform:scale(.88);}
.fab.hide{opacity:0;pointer-events:none;transform:scale(.6);}

/* ===== Search / Filter ===== */
.search-wrap{position:relative;margin:12px 0;display:flex;align-items:center;gap:8px;}
.search-wrap .s-ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.5;pointer-events:none;}
.search-input{
  flex:1 1 auto;min-width:0;
  padding:11px 14px 11px 36px;background:var(--surface);
  border:none;border-radius:12px;color:var(--text);font-size:16px;
  min-height:42px;box-shadow:var(--shadow-sm);
}
.search-input:focus{outline:none;box-shadow:0 0 0 2px var(--accent-soft),var(--shadow-sm);}
.search-input::placeholder{color:var(--text-dim);}
/* 「隐藏已完成」开关：贴在搜索框右侧，激活时整块变主色 */
.hide-done-btn{
  flex:0 0 auto;min-height:42px;padding:0 12px;border:none;border-radius:12px;cursor:pointer;
  background:var(--surface);color:var(--text-dim);font-size:12.5px;font-weight:600;
  white-space:nowrap;box-shadow:var(--shadow-sm);transition:all .16s;
  -webkit-tap-highlight-color:transparent;
}
.hide-done-btn.active{background:var(--accent);color:var(--on-accent);box-shadow:0 3px 12px var(--accent-glow);}
.hide-done-btn:active{transform:scale(.96);}
@media (max-width:340px){ .hide-done-btn{padding:0 9px;font-size:11.5px;} }
.filter-chips{display:flex;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 0 6px;scrollbar-width:none;}
.filter-chips::-webkit-scrollbar{display:none;}
.chip{
  padding:7px 13px;border-radius:20px;background:var(--surface);border:none;color:var(--text-dim);
  font-size:13px;white-space:nowrap;cursor:pointer;flex-shrink:0;font-weight:500;
  box-shadow:var(--shadow-sm);transition:all .16s;
}
.chip.active{background:var(--accent);color:var(--on-accent);box-shadow:0 3px 12px var(--accent-glow);}
/* 筛选 chip 上的条数角标 */
.chip-n{margin-left:5px;font-size:11px;font-weight:700;opacity:.55;font-variant-numeric:tabular-nums;}
.chip.active .chip-n{opacity:.85;}

/* 横滑容器的「还有内容」提示：原生滚动条是 overlay，看不见，
   所以在两端做渐隐（由 syncEdgeFade 按滚动位置开关） */
.fade-l{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 26px);mask-image:linear-gradient(90deg,transparent 0,#000 26px);}
.fade-r{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 26px),transparent 100%);mask-image:linear-gradient(90deg,#000 calc(100% - 26px),transparent 100%);}
.fade-l.fade-r{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 26px,#000 calc(100% - 26px),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 26px,#000 calc(100% - 26px),transparent 100%);}

/* ===== Schedule ===== */
.schedule-nav{display:flex;align-items:center;justify-content:center;gap:14px;margin:16px 0 6px;}
.schedule-month{
  font-size:19px;font-weight:700;min-width:150px;text-align:center;
  background:none;border:none;color:var(--text);cursor:pointer;padding:6px 4px;border-radius:10px;
}
.schedule-month .hint{display:block;font-size:11px;font-weight:500;color:var(--accent);margin-top:-2px;}
.nav-arrow{
  width:40px;height:40px;border-radius:12px;background:var(--surface);border:none;color:var(--text);
  font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:var(--shadow-sm);
}
.nav-arrow:active{background:var(--surface-2);}
.schedule-summary{
  padding:14px 16px;background:var(--accent-soft);border-radius:12px;font-size:14px;color:var(--accent);
  margin:10px 0 12px;font-weight:600;display:flex;justify-content:space-between;align-items:center;
}

/* ===== Month sections ===== */
.month-section{background:var(--surface);border-radius:var(--radius);overflow:hidden;margin-bottom:10px;box-shadow:var(--shadow-sm);}
.month-header{display:flex;align-items:center;padding:14px 16px;cursor:pointer;gap:8px;user-select:none;transition:background .15s;}
.month-header:active{background:var(--surface-2);}
.month-header .m-name{font-weight:700;font-size:16px;flex-shrink:0;}
.month-header .m-summary{flex:1;text-align:right;font-size:12.5px;color:var(--text-dim);}
.month-header .m-arrow{font-size:13px;color:var(--text-dim);flex-shrink:0;transition:transform .22s;}
.month-section.expanded .m-arrow{transform:rotate(90deg);}
.month-body{padding:0 10px 10px;}
.month-body .comm-card{box-shadow:none;background:var(--surface-2);margin-bottom:8px;}

/* ===== Calculator / Pressure ===== */
.calc-card,.pressure-card{background:var(--surface);border-radius:20px;padding:20px;margin-top:16px;box-shadow:var(--shadow-md);}
.calc-intro{padding:14px 16px;background:var(--surface-2);border-radius:12px;font-size:13px;line-height:1.65;color:var(--text-dim);margin-bottom:18px;}
.calc-intro b{color:var(--text);font-weight:600;}
.calc-result{margin-top:18px;padding:26px 22px;border-radius:16px;text-align:center;background:var(--surface-2);}
.calc-result .label{font-size:13px;color:var(--text-dim);margin-bottom:8px;}
.calc-result .amount{font-size:34px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums;}
.calc-result .amount.green{color:var(--green);}
.calc-result .amount.red{color:var(--red);}
.calc-breakdown{margin-top:12px;display:flex;flex-direction:column;gap:8px;}
.breakdown-row{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:var(--surface-2);border-radius:12px;font-size:14px;gap:10px;}
.breakdown-row.highlight{background:var(--accent-soft);}
.breakdown-row.green-row{background:var(--green-soft);}
.breakdown-row .b-label{color:var(--text-dim);font-size:12px;line-height:1.5;}
.breakdown-row .b-value{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;}
.breakdown-row.highlight .b-value{color:var(--accent);}
.breakdown-row.green-row .b-value{color:var(--green);}

.pressure-result{margin-top:18px;padding:26px 20px;border-radius:20px;text-align:center;background:var(--surface-2);transition:background .3s;}
.pressure-result.safe{background:var(--green-soft);}
.pressure-result.warn{background:var(--orange-soft);}
.pressure-result.danger{background:var(--red-soft);}
.pressure-result .emoji{font-size:44px;margin-bottom:8px;line-height:1;}
.pressure-result .verdict{font-size:20px;font-weight:800;margin-bottom:6px;}
.pressure-result.safe .verdict{color:var(--green);}
.pressure-result.warn .verdict{color:var(--orange);}
.pressure-result.danger .verdict{color:var(--red);}
.pressure-result .detail{font-size:14px;color:var(--text-dim);}
.pressure-breakdown{margin-top:14px;display:flex;flex-direction:column;gap:8px;}
.pb-row{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--surface-2);border-radius:12px;font-size:14px;gap:10px;}
.pb-row .pb-label{color:var(--text-dim);font-size:13px;}
.pb-row .pb-value{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;}
.pb-row.income .pb-value{color:var(--green);}
.pb-row.expense .pb-value{color:var(--red);}
.pb-divider{height:1px;background:var(--border);margin:2px 0;}
.auto-fill{font-size:11px;color:var(--accent);background:var(--accent-soft);padding:5px 10px;border-radius:8px;font-weight:600;white-space:nowrap;flex-shrink:0;}

/* ===== Segment ===== */
/* 分栏多起来之后一行放不下，这里做成横向滑动。
   注意：Chrome 的滚动条是 overlay，滚动时才会浮出来，平时看不见 ——
   所以不能指望原生滚动条当提示，自己在下边画一条细滑条（可拖），
   再配合切栏时把当前项滚到中间，用户才知道右边还有东西 */
.seg-wrap{position:relative;margin:16px 0 0;}
.seg-row{display:flex;gap:6px;align-items:stretch;}
.seg-control{
  flex:1 1 auto;min-width:0;
  display:flex;background:var(--surface-2);border-radius:13px;padding:4px;gap:3px;
  overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.seg-control::-webkit-scrollbar{display:none;}
.seg-btn{
  flex:0 0 auto;border:none;background:transparent;color:var(--text-dim);font-size:12px;font-weight:600;
  padding:9px 11px;border-radius:10px;cursor:pointer;transition:all .2s;white-space:nowrap;
  -webkit-tap-highlight-color:transparent;
}
.seg-btn.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm);}
/* 排序入口常驻在分栏右侧，不跟着横滑跑，免得用户找不到 */
.seg-sort{
  flex:0 0 auto;width:40px;border:none;border-radius:13px;background:var(--surface-2);
  color:var(--text-mid);font-size:15px;line-height:1;cursor:pointer;transition:all .16s;
  -webkit-tap-highlight-color:transparent;
}
.seg-sort:active{background:var(--surface-3);transform:scale(.95);}
.seg-rail{height:14px;display:flex;align-items:center;margin:0 14px;touch-action:none;cursor:grab;}
.seg-rail:active{cursor:grabbing;}
.seg-track{position:relative;width:100%;height:3px;border-radius:2px;background:var(--surface-3);overflow:hidden;}
.seg-track i{position:absolute;top:0;left:0;height:100%;border-radius:2px;background:var(--accent-light);transition:width .1s linear;}
.lab-sub{display:none;}
.lab-sub.active{display:block;}

/* ===== 分栏排序 ===== */
.order-item{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--border-soft);}
.order-item:last-child{border-bottom:none;}
.oi-idx{width:18px;flex-shrink:0;text-align:center;font-size:11.5px;color:var(--text-dim);font-variant-numeric:tabular-nums;}
.oi-name{flex:1 1 auto;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.oi-btn{
  flex-shrink:0;width:40px;height:36px;border:none;border-radius:9px;background:var(--surface-2);
  color:var(--text-mid);font-size:15px;cursor:pointer;transition:background .14s;
  -webkit-tap-highlight-color:transparent;
}
.oi-btn:active:not(:disabled){background:var(--surface-3);}
.oi-btn:disabled{opacity:.28;cursor:default;}

/* ===== 玄学抽签 ===== */
.fortune-card{background:var(--surface);border-radius:var(--radius);padding:22px 18px;box-shadow:var(--shadow-sm);text-align:center;margin-top:16px;}
.f-orb{
  width:76px;height:76px;margin:0 auto 14px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:34px;background:radial-gradient(circle at 34% 28%,var(--accent-soft),var(--surface-2));
  border:1px solid var(--border-soft);
}
.f-orb.shake{animation:f-shake .5s cubic-bezier(.36,.07,.19,.97);}
@keyframes f-shake{
  0%,100%{transform:translateX(0) rotate(0);}
  15%{transform:translateX(-5px) rotate(-7deg);}
  30%{transform:translateX(5px) rotate(7deg);}
  45%{transform:translateX(-4px) rotate(-5deg);}
  60%{transform:translateX(4px) rotate(5deg);}
  80%{transform:translateX(-2px) rotate(-2deg);}
}
.f-hint{font-size:12.5px;color:var(--text-dim);line-height:1.65;margin-bottom:16px;}
.f-lv{
  display:inline-block;font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px;margin-bottom:10px;
  letter-spacing:1px;
}
.f-lv.great{background:var(--green-soft);color:var(--green);}
.f-lv.good{background:var(--accent-soft);color:var(--accent);}
.f-lv.mid{background:var(--accent-soft);color:var(--accent);}
.f-lv.flat{background:var(--surface-2);color:var(--text-mid);}
.f-lv.late{background:var(--orange-soft);color:var(--orange);}
.f-poem{font-size:19px;font-weight:700;line-height:1.5;margin-bottom:10px;letter-spacing:.5px;}
.f-read{font-size:13.5px;color:var(--text-mid);line-height:1.7;margin-bottom:14px;}
.f-pred{
  font-size:13px;font-weight:600;padding:10px 14px;border-radius:12px;background:var(--surface-2);
  color:var(--text);line-height:1.6;
}
.f-lucky{
  display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;
  font-size:13px;color:var(--text-mid);
}
.f-lucky b{color:var(--accent);}
.f-basis{
  display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px;padding-top:14px;
  border-top:1px solid var(--border-soft);
}
.f-basis span{font-size:11.5px;color:var(--text-dim);background:var(--surface-2);padding:5px 10px;border-radius:8px;}
.f-basis b{color:var(--text-mid);}
.f-reveal{animation:f-pop .42s cubic-bezier(.34,1.4,.5,1);}
@keyframes f-pop{from{opacity:0;transform:scale(.92) translateY(10px);}to{opacity:1;transform:none;}}

/* ===== 近期动态 ===== */
.feed-head{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin:16px 0 10px;font-size:13px;font-weight:700;
}
.feed-head .fh-sub{font-size:11.5px;color:var(--text-dim);font-weight:500;}
.radar-row{
  display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:13px;
  padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow-sm);
}
.radar-rank{
  flex-shrink:0;width:22px;height:22px;border-radius:50%;background:var(--surface-2);color:var(--text-dim);
  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums;
}
.radar-row.top .radar-rank{background:var(--accent);color:var(--on-accent);}
.rr-main{flex:1 1 auto;min-width:0;}
.rr-title{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rr-sub{font-size:11.5px;color:var(--text-dim);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rr-right{flex-shrink:0;text-align:right;}
.rr-days{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;}
.rr-days.over{color:var(--red);}
.rr-days.soon{color:var(--orange);}
.rr-days.ok{color:var(--text-mid);}
.rr-days.none{color:var(--text-dim);font-weight:500;}
.rr-amt{font-size:11px;color:var(--text-dim);margin-top:3px;font-variant-numeric:tabular-nums;}
.radar-guess{
  background:var(--accent-soft);border-radius:13px;padding:12px 14px;margin-bottom:12px;
  font-size:13px;line-height:1.7;color:var(--text-mid);
}
.radar-guess b{color:var(--accent);}
/* 被搁置（画师失联）的那几张，收在雷达下面，默认不占位置 */
.radar-parked-btn{
  display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;
  border:none;background:var(--surface-2);color:var(--text-dim);font-size:12.5px;font-weight:600;
  padding:11px 14px;border-radius:12px;cursor:pointer;margin-top:10px;text-align:left;
  -webkit-tap-highlight-color:transparent;
}
.radar-parked-btn:active{background:var(--surface-3);}
.radar-parked-btn .rp-arrow{font-size:11px;font-weight:500;flex-shrink:0;}
.radar-parked-list{margin-top:8px;}
.radar-parked-list .radar-row{opacity:.62;}
.radar-parked-list .radar-rank{font-size:12px;}
.feed-day{font-size:11.5px;font-weight:700;color:var(--text-dim);margin:16px 0 8px;letter-spacing:.4px;}
.feed-day:first-child{margin-top:0;}
.feed-item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border-soft);}
.feed-item:last-child{border-bottom:none;}
.fi-ico{
  flex-shrink:0;width:28px;height:28px;border-radius:9px;background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;font-size:14px;
}
.fi-main{flex:1 1 auto;min-width:0;}
.fi-text{font-size:13px;line-height:1.5;color:var(--text);}
.fi-text b{font-weight:600;}
.fi-text .fi-amt{color:var(--green);font-weight:700;font-variant-numeric:tabular-nums;}
.fi-time{font-size:11px;color:var(--text-dim);margin-top:3px;}
.feed-card{background:var(--surface);border-radius:var(--radius);padding:16px 16px 6px;box-shadow:var(--shadow-sm);}

/* ===== Guarantee / Wish ===== */
.gcard{background:var(--surface);border-radius:14px;padding:16px;margin-bottom:10px;box-shadow:var(--shadow-sm);transition:opacity .2s,transform .14s;}
.gcard:active{transform:scale(.99);}
.gcard.done{opacity:.52;}
.gcard-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.gcard-title{font-size:16px;font-weight:600;}
.gcard-meta{font-size:12.5px;color:var(--text-dim);margin-top:3px;}
.gcard-note{font-size:13px;color:var(--text-mid);margin-top:8px;line-height:1.55;}
.gcard-actions{display:flex;gap:8px;margin-top:12px;}
.gcard-actions button{
  border:none;background:var(--surface-2);color:var(--text-mid);font-size:12.5px;
  padding:8px 13px;border-radius:9px;cursor:pointer;font-weight:500;min-height:34px;
}
.gcard-actions button:active{background:var(--surface-3);}
.gcard-actions .del-btn{color:var(--red);}

/* ===== Trend ===== */
.trend-card{background:var(--surface);border-radius:var(--radius);padding:18px 16px;box-shadow:var(--shadow-sm);}
.trend-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
.trend-head h3{font-size:15.5px;font-weight:700;margin:0;}
.trend-note{font-size:12px;color:var(--text-dim);line-height:1.6;margin-bottom:13px;}
.trend-toggles{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:15px;}
.tg{display:flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px;}
.tg button{
  border:none;background:transparent;color:var(--text-dim);font-size:11.5px;font-weight:600;
  padding:5px 10px;border-radius:7px;cursor:pointer;white-space:nowrap;transition:all .15s;
  -webkit-tap-highlight-color:transparent;
}
.tg button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm);}

.trend-plot{display:flex;gap:6px;align-items:flex-start;}
.tp-gutter{position:relative;width:34px;height:158px;flex-shrink:0;}
.tp-ylab{position:absolute;right:0;font-size:9.5px;line-height:1;color:var(--text-dim);white-space:nowrap;font-variant-numeric:tabular-nums;}
.tp-scroll{flex:1 1 auto;min-width:0;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;padding-bottom:3px;scrollbar-width:thin;}
.tp-inner{width:100%;}
.tp-area{position:relative;height:158px;}
.tp-grid{position:absolute;inset:0;pointer-events:none;}
.tp-grid i{position:absolute;left:0;right:0;height:1px;background:var(--border-soft);}
.tp-grid i:last-child{background:var(--border);}
.tp-cols{position:relative;z-index:1;display:flex;align-items:flex-end;justify-content:center;gap:5px;height:100%;}
.tp-col{
  flex:1 1 0;max-width:42px;height:100%;display:flex;align-items:flex-end;padding:0 1px;
  border-radius:8px 8px 0 0;cursor:pointer;transition:background .15s;-webkit-tap-highlight-color:transparent;
}
.tp-col.on{background:var(--accent-soft);}
.tp-bar{width:100%;display:flex;flex-direction:column-reverse;border-radius:6px 6px 2px 2px;overflow:hidden;}
.tp-seg{width:100%;transition:height .45s cubic-bezier(.32,.72,0,1);}
.tp-seg.seg-a{background:linear-gradient(180deg,var(--accent-light),var(--accent));}
.tp-seg.seg-b{background:repeating-linear-gradient(-45deg,var(--orange) 0 2.5px,transparent 2.5px 5px),var(--orange-soft);}
.tp-stub{width:100%;height:3px;border-radius:2px;background:var(--border);}
.tp-xaxis{display:flex;justify-content:center;gap:5px;margin-top:6px;}
.tp-xl{flex:1 1 0;max-width:42px;text-align:center;font-size:9.5px;color:var(--text-dim);white-space:nowrap;overflow:hidden;}
.tp-xl.on{color:var(--accent);font-weight:700;}
.tp-now{display:block;width:3px;height:3px;border-radius:50%;background:var(--accent);margin:3px auto 0;}
.tp-legend{display:flex;gap:16px;justify-content:center;margin-top:11px;font-size:11px;color:var(--text-dim);}
.tp-legend span{display:inline-flex;align-items:center;gap:5px;}
.tp-legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}
.tp-legend i.a{background:linear-gradient(180deg,var(--accent-light),var(--accent));}
.tp-legend i.b{background:repeating-linear-gradient(-45deg,var(--orange) 0 2.5px,transparent 2.5px 5px),var(--orange-soft);}

.trend-detail{margin-top:15px;padding:13px 14px;background:var(--surface-2);border-radius:13px;}
.td-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:9px;}
.td-top b{font-size:14px;}
.td-top span{font-size:11.5px;color:var(--text-dim);}
.td-prog{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;margin-bottom:11px;}
.td-prog-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent-light));transition:width .4s cubic-bezier(.32,.72,0,1);}
.td-rows{display:flex;gap:8px;}
.td-row{flex:1;min-width:0;text-align:center;}
.td-row span{display:block;font-size:10.5px;color:var(--text-dim);margin-bottom:2px;}
.td-row b{font-size:14px;font-variant-numeric:tabular-nums;}
.td-row b.pos{color:var(--green);}
.td-row b.neg{color:var(--orange);}

.trend-stats{display:flex;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border-soft);}
.trend-stat{flex:1;min-width:0;text-align:center;}
.trend-stat .ts-val{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;}
.trend-stat .ts-label{font-size:10.5px;color:var(--text-dim);margin-top:3px;}

/* ===== Form ===== */
.form-group{margin-bottom:15px;}
.form-group label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:6px;font-weight:500;}
.form-input,.form-textarea{
  width:100%;max-width:100%;min-width:0;padding:12px 14px;background:var(--field-bg);border:1.5px solid var(--field-border);
  border-radius:12px;color:var(--text);font-size:16px;min-height:44px;transition:border-color .15s,background .15s;
}
.form-input:focus,.form-textarea:focus{outline:none;border-color:var(--accent);background-color:var(--surface);}
select.form-input{
  appearance:none;-webkit-appearance:none;padding-right:38px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--text-dim) 50%),linear-gradient(135deg,var(--text-dim) 50%,transparent 50%);
  background-position:calc(100% - 18px) center,calc(100% - 13px) center;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
}
.form-input::placeholder,.form-textarea::placeholder{color:var(--text-dim);}
.form-textarea{resize:none;min-height:72px;line-height:1.5;}
.form-row{display:flex;gap:10px;flex-wrap:wrap;}
.form-row .form-group{flex:1 1 0;min-width:0;}
/* iOS 的日期/月份输入框有固有宽度，挤不下就整行竖排，免得撑出横向滚动 */
.form-row.dates .form-group{flex:1 1 140px;}
@media (max-width:430px){
  .form-row.dates{flex-direction:column;gap:0;}
  .form-row.dates .form-group{flex:1 1 auto;width:100%;}
}
input[type="date"],input[type="month"]{min-width:0;max-width:100%;}
.ms-template-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.ms-template-btn{
  padding:9px 14px;background:var(--surface-2);border:none;border-radius:10px;color:var(--text-mid);
  font-size:13px;cursor:pointer;transition:all .15s;font-weight:500;
}
.ms-template-btn:active{background:var(--accent-soft);color:var(--accent);}
.ms-item{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.ms-item input[type="text"]{
  flex:1;min-width:0;padding:10px 12px;background:var(--field-bg);border:1.5px solid var(--field-border);
  border-radius:10px;color:var(--text);font-size:16px;min-height:42px;
}
.ms-item input[type="text"]:focus{outline:none;border-color:var(--accent);background:var(--surface);}
.ms-item .remove-ms{background:none;border:none;color:var(--red);cursor:pointer;font-size:20px;padding:0 8px;min-width:34px;height:42px;}
.checkbox-row{display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;font-size:12px;color:var(--text-dim);}
.checkbox-row input{width:18px;height:18px;cursor:pointer;accent-color:var(--accent);}

/* ===== Sheets / Layers ===== */
.layer{position:fixed;inset:0;z-index:1000;display:none;background:var(--scrim);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);}
.layer.show{display:block;animation:fadeIn .22s ease;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{
  position:absolute;bottom:0;left:0;right:0;max-width:500px;margin:0 auto;
  max-height:92dvh;display:flex;flex-direction:column;
  background:var(--sheet-bg);border-radius:24px 24px 0 0;
  box-shadow:0 -10px 44px rgba(0,0,0,.18);
  transform:translateY(102%);transition:transform .34s cubic-bezier(.32,.72,0,1);
  touch-action:pan-y;
}
.sheet.show{transform:translateY(0);}
.sheet.dragging{transition:none;}
.sheet-grab{padding:8px 20px 0;cursor:grab;touch-action:none;}
.sheet-handle{width:36px;height:5px;background:var(--border);border-radius:3px;margin:0 auto 14px;}
.sheet-title{font-size:20px;font-weight:700;margin:0 20px 16px;}
.sheet-body{padding:0 20px;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;-webkit-overflow-scrolling:touch;flex:1;overscroll-behavior:contain;}
.sheet-footer{display:flex;gap:10px;padding:14px 20px calc(var(--safe-bottom) + 16px);}
.sheet-footer .btn{flex:1;min-width:0;padding:0 12px;}
.sheet-note{font-size:12px;color:var(--text-dim);line-height:1.7;}

/* Action sheet */
.action-sheet{padding:8px 12px calc(var(--safe-bottom) + 12px);}
.action-title{padding:6px 12px 12px;font-size:13px;color:var(--text-dim);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.action-item{
  width:100%;display:flex;align-items:center;gap:12px;padding:15px 14px;border:none;background:transparent;
  color:var(--text);font-size:16px;font-weight:500;border-radius:14px;cursor:pointer;text-align:left;
}
.action-item:active{background:var(--surface-2);}
.action-item .ai{font-size:18px;width:24px;text-align:center;flex-shrink:0;}
.action-item.danger{color:var(--red);}
.action-cancel{
  width:100%;margin-top:6px;padding:15px;border:none;border-radius:14px;background:var(--surface-2);
  color:var(--text);font-size:16px;font-weight:600;cursor:pointer;
}

/* Dialog */
.dialog-layer{display:none;align-items:center;justify-content:center;padding:24px;}
.dialog-layer.show{display:flex;}
.dialog{
  width:100%;max-width:330px;background:var(--sheet-bg);border-radius:20px;padding:22px 20px 16px;
  box-shadow:var(--shadow-lg);animation:pop .24s cubic-bezier(.34,1.56,.64,1);
}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.dialog h3{font-size:17px;font-weight:700;text-align:center;margin-bottom:8px;}
.dialog p{font-size:14px;color:var(--text-dim);text-align:center;line-height:1.6;margin-bottom:18px;word-break:break-word;}
.dialog-actions{display:flex;gap:10px;}
.dialog-actions .btn{flex:1;}

/* Toast */
.toast-layer{position:fixed;left:0;right:0;bottom:calc(var(--tab-h) + var(--safe-bottom) + 22px);z-index:2000;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;}
.toast{
  max-width:80%;padding:11px 18px;border-radius:14px;background:rgba(28,28,32,.92);color:#fff;
  font-size:14px;font-weight:500;box-shadow:0 8px 28px rgba(0,0,0,.25);
  animation:toastIn .28s cubic-bezier(.32,.72,0,1);display:flex;align-items:center;gap:8px;
}
.toast.out{animation:toastOut .25s ease forwards;}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px) scale(.97)}}

/* ===== 纪念日 ===== */
.cd-num{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.4px;color:var(--text-mid);line-height:1.2;}
.cd-num.near{color:var(--accent);}
.cd-label{font-size:10.5px;color:var(--text-dim);margin-top:1px;min-height:14px;}
.date-linked{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;padding:9px 12px;background:var(--surface-2);border-radius:10px;font-size:12px;color:var(--text-mid);}
.date-linked b{color:var(--text);font-variant-numeric:tabular-nums;}
.date-linked b.warn{color:var(--orange);}
.up-date{display:flex;align-items:center;gap:12px;padding:13px 15px;background:var(--surface);border-radius:14px;margin-bottom:8px;box-shadow:var(--shadow-sm);cursor:pointer;}
.up-date:active{transform:scale(.99);}
.up-date .ud-icon{font-size:22px;flex-shrink:0;}
.up-date .ud-main{flex:1;min-width:0;}
.up-date .ud-name{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.up-date .ud-sub{font-size:11.5px;color:var(--text-dim);margin-top:2px;}
.up-date .ud-days{font-size:17px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;flex-shrink:0;}
.up-date .ud-days.today{color:var(--red);}
.link-picker{max-height:232px;overflow-y:auto;overscroll-behavior:contain;border-radius:12px;background:var(--surface-2);padding:4px;}
.link-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:14px;}
.link-item:active{background:var(--surface-3);}
.link-item input{width:19px;height:19px;accent-color:var(--accent);flex-shrink:0;cursor:pointer;}
.link-item .li-main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;}
.link-item .li-main > *{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.link-item .li-sub{font-size:11px;color:var(--text-dim);}
.link-item .li-price{font-size:12.5px;color:var(--text-dim);font-variant-numeric:tabular-nums;flex-shrink:0;}

/* Empty state */
.empty-state{text-align:center;padding:52px 20px;color:var(--text-dim);}
.empty-state .icon{font-size:48px;margin-bottom:14px;opacity:.35;}
.empty-state p{font-size:14.5px;}
.empty-state .es-sub{font-size:12.5px;margin-top:6px;opacity:.8;}
.empty-state .btn{margin-top:18px;}

/* A2HS banner */
.a2hs-banner{
  display:flex;align-items:center;gap:10px;margin-top:14px;padding:13px 15px;
  background:var(--accent-soft);border-radius:14px;cursor:pointer;
}
.a2hs-banner .ab-ico{font-size:20px;}
.a2hs-banner .ab-txt{flex:1;font-size:13px;color:var(--accent);font-weight:600;line-height:1.45;}
.a2hs-banner .ab-close{background:none;border:none;color:var(--text-dim);font-size:17px;padding:4px 6px;cursor:pointer;}

/* Settings list */
.s-list{background:var(--surface);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);margin-bottom:14px;}
.s-item{display:flex;align-items:center;gap:12px;padding:15px 16px;background:transparent;border:none;width:100%;cursor:pointer;text-align:left;color:var(--text);font-size:15.5px;font-weight:500;}
.s-item + .s-item{border-top:1px solid var(--border-soft);}
.s-item:active{background:var(--surface-2);}
.s-item .si-ico{font-size:18px;width:24px;text-align:center;flex-shrink:0;}
.s-item .si-sub{display:block;font-size:12px;color:var(--text-dim);font-weight:400;margin-top:2px;}
.s-item .si-arrow{margin-left:auto;color:var(--text-dim);font-size:14px;}
.s-item.danger{color:var(--red);}

/* Theme cards */
.theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.theme-card{
  position:relative;padding:14px;border-radius:16px;cursor:pointer;
  background:var(--surface-2);border:2px solid transparent;transition:border-color .18s,transform .14s;
}
.theme-card:active{transform:scale(.97);}
.theme-card.active{border-color:var(--accent);}
.theme-card .tc-dots{display:flex;gap:5px;margin-bottom:10px;}
.theme-card .tc-dot{width:20px;height:20px;border-radius:50%;border:1px solid rgba(0,0,0,.08);}
.theme-card .tc-name{font-size:14.5px;font-weight:700;}
.theme-card .tc-desc{font-size:11px;color:var(--text-dim);margin-top:3px;line-height:1.45;}
.theme-card .tc-check{position:absolute;top:12px;right:12px;font-size:14px;color:var(--accent);font-weight:700;}

/* A2HS guide */
.guide-step{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--border-soft);}
.guide-step:last-child{border-bottom:none;}
.guide-num{
  width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--on-accent);
  font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;
}
.guide-txt{flex:1;font-size:14px;line-height:1.6;}
.guide-txt b{color:var(--accent);}
.tip-box{padding:13px 15px;background:var(--orange-soft);border-radius:12px;font-size:12.5px;color:var(--orange);line-height:1.65;margin-top:14px;}
.icon-preview{display:flex;align-items:center;gap:14px;padding:13px 15px;margin:12px 0 4px;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:14px;}
.icon-preview img{width:62px;height:62px;border-radius:14px;flex-shrink:0;box-shadow:0 4px 12px rgba(0,0,0,.16);display:block;}
.icon-preview .ip-txt{display:flex;flex-direction:column;gap:3px;min-width:0;}
.icon-preview .ip-txt b{font-size:14px;}
.icon-preview .ip-txt span{font-size:12px;color:var(--text-dim);line-height:1.5;}

.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border-soft);font-size:14px;}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--text-dim);}
.kv .v{font-weight:600;font-variant-numeric:tabular-nums;}

.money{font-variant-numeric:tabular-nums;font-weight:600;}
.text-dim{color:var(--text-dim);}
.divider{height:1px;background:var(--border);margin:18px 0;}
.spacer{height:8px;}

@media (min-width:641px){
  #app{max-width:500px;margin:0 auto;box-shadow:0 0 40px rgba(0,0,0,.05);}
  .fab{right:calc(50% - 250px + 20px);}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important;}
}
</style>
<script>
/* 首屏防闪白：在渲染前先把主题挂到 <html> 上 */
try {
  var _st = JSON.parse(localStorage.getItem('commission_tracker_v3') || '{}');
  var _th = (_st.prefs && _st.prefs.theme) || 'light';
  document.documentElement.setAttribute('data-theme', _th);
  if (_th === 'night') { document.documentElement.style.colorScheme = 'dark'; }
} catch (e) {}
</script>

<body>
<div id="app">
  <header class="top-bar" id="topBar">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;">
      <div style="min-width:0;">
        <h1 id="pageTitle">约稿<span class="accent">尾款</span>管家</h1>
        <div class="subtitle" id="pageSubtitle">管理你的约稿排期与尾款</div>
      </div>
      <div class="tb-actions">
        <button class="icon-btn" data-act="open-theme" aria-label="配色主题">🎨</button>
        <button class="icon-btn" data-act="open-settings" aria-label="设置">⚙️</button>
      </div>
    </div>
  </header>

  <main class="content" id="content">
    <section id="view-dashboard" class="view active">
      <div id="a2hsSlot"></div>
      <div class="stat-grid" id="statsGrid"></div>
      <div id="dateSlot"></div>
      <div class="section">
        <div class="section-header">
          <h2>📅 各月尾款</h2>
          <div class="sh-actions">
            <button class="btn btn-ghost btn-sm btn-order" id="monthOrderBtn" data-act="toggle-month-order">↑ 早 → 晚</button>
            <button class="btn btn-primary btn-sm" data-act="add">+ 新增</button>
          </div>
        </div>
        <div id="monthList"></div>
      </div>
    </section>

    <section id="view-list" class="view">
      <div class="search-wrap">
        <span class="s-ico">🔍</span>
        <input class="search-input" id="searchInput" placeholder="搜索稿件 / 画师" enterkeyhint="search">
        <button class="hide-done-btn" id="hideDoneBtn" data-act="toggle-hide-done" aria-pressed="false">👁 隐藏已完成</button>
      </div>
      <div class="filter-chips" id="filterChips"></div>
      <div id="listContainer" style="margin-top:8px;"></div>
    </section>

    <section id="view-schedule" class="view">
      <div class="schedule-nav">
        <button class="nav-arrow" data-act="prev-month" aria-label="上个月">‹</button>
        <button class="schedule-month" id="scheduleTitle" data-act="this-month"></button>
        <button class="nav-arrow" data-act="next-month" aria-label="下个月">›</button>
      </div>
      <div id="scheduleGrid"></div>
    </section>

    <section id="view-calculator" class="view">
      <div class="calc-card">
        <div class="calc-intro">
          已知稿件总价 <b>n</b>（含 5% 平台手续费）和画师平台留档价 <b>P</b>，计算需<b style="color:var(--accent)">线下转账</b>金额。<br>
          <span style="font-size:12px">公式：线下转账 =（n − P）× 95%</span>
        </div>
        <div class="form-group">
          <label>稿件总价 n — 含手续费 (¥)</label>
          <input class="form-input" type="number" inputmode="decimal" id="calcTotal" placeholder="如 5000">
        </div>
        <div class="form-group">
          <label>画师平台留档价 P (¥)</label>
          <input class="form-input" type="number" inputmode="decimal" id="calcPlatform" placeholder="如 50">
        </div>
        <div class="calc-result">
          <div class="label">线下转账金额</div>
          <div class="amount" id="calcAmount">¥ 0</div>
        </div>
        <div class="calc-breakdown" id="calcBreakdown"></div>
      </div>
      <div class="section">
        <div class="section-header"><h2>📌 快捷选取</h2></div>
        <div id="calcQuickPick"></div>
      </div>
    </section>

    <section id="view-lab" class="view">
      <div class="seg-wrap">
        <div class="seg-row">
          <!-- 按钮由 renderSegControl() 按 prefs.labOrder 生成，顺序用户可以自己排 -->
          <div class="seg-control" id="segControl"></div>
          <button class="seg-sort" data-act="open-lab-order" aria-label="调整分栏顺序" title="调整分栏顺序">⇄</button>
        </div>
        <div class="seg-rail" id="segRail" aria-hidden="true"><div class="seg-track"><i id="segThumb"></i></div></div>
      </div>

      <div class="lab-sub" id="lab-pressure">
        <div class="pressure-card">
          <div class="calc-intro">
            输入本月预计收入和固定支出，结合<b>待付尾款</b>，看看资金压力如何。<br>
            <span style="font-size:12px;color:var(--accent)">本月尾款已自动填入</span>
          </div>
          <div class="form-group">
            <label>预计工资 (¥)</label>
            <input class="form-input" type="number" inputmode="decimal" id="pr_salary" placeholder="如 8000">
          </div>
          <div class="form-group">
            <label>预计其他收入 (¥) <span style="font-size:11px">（稿费/副业/理财等）</span></label>
            <input class="form-input" type="number" inputmode="decimal" id="pr_other_income" placeholder="如 2000">

            <label>其他固定支出 (¥) <span style="font-size:11px">（房租/卡/保险等）</span></label>
            <input class="form-input" type="number" inputmode="decimal" id="pr_other_expense" placeholder="如 1500">
          </div>
          <div class="form-group">
            <label>本月尾款 (¥)</label>
            <div style="display:flex;align-items:center;gap:8px;">
              <input class="form-input" type="number" inputmode="decimal" id="pr_tail" placeholder="0">
              <span class="auto-fill" id="prAutoFill">自动</span>

          <div id="pressureResult" style="display:none;"></div>
          <div class="pressure-breakdown" id="pressureBreakdown" style="display:none;"></div>
        </div>

      <div class="lab-sub" id="lab-guarantee">
        <div style="margin-top:16px;">
          <div class="calc-intro" style="margin-bottom:12px;">画师承诺「下次接」但不知道下次是什么时候。记下来，等画师开稿时拿出来用。</div>
          <div id="guaranteeList"></div>
        </div>
      </div>

      <div class="lab-sub" id="lab-wishes">
        <div style="margin-top:16px;">
          <div class="calc-intro" style="margin-bottom:12px;">想约的东西，画个饼记下来。预估价格，排优先级。</div>
          <div id="wishesList"></div>
        </div>
      </div>

      <div class="lab-sub" id="lab-dates">
        <div style="margin-top:16px;">
          <div class="calc-intro" style="margin-bottom:12px;">亲友、OC、企划的生日和纪念日，倒着数。可以关联已有的稿件，自动算这块总共花了多少。</div>
          <div id="datesList"></div>
        </div>
      </div>

      <div class="lab-sub" id="lab-trend">
        <div style="margin-top:16px;" id="trendChart"></div>
      </div>

      <div class="lab-sub active" id="lab-feed">
        <div style="margin-top:16px;" id="feedBox"></div>
      </div>

      <div class="lab-sub" id="lab-fortune">
        <div id="fortuneBox"></div>
      </div>
    </section>
  </main>

  <button class="fab" id="fab" data-act="add" aria-label="新增稿件">+</button>

  <nav class="tab-bar" id="tabBar">
    <button class="tab-btn" data-act="nav" data-view="dashboard"><span class="tab-icon">📊</span><span>总览</span></button>
    <button class="tab-btn" data-act="nav" data-view="list"><span class="tab-icon">🎨</span><span>稿件</span></button>
    <button class="tab-btn" data-act="nav" data-view="schedule"><span class="tab-icon">📅</span><span>排期</span></button>
    <button class="tab-btn" data-act="nav" data-view="calculator"><span class="tab-icon">💸</span><span>计算器</span></button>
    <button class="tab-btn" data-act="nav" data-view="lab"><span class="tab-icon">🧪</span><span>实验室</span></button>
  </nav>
</div>

<div class="layer" id="sheetLayer"><div class="sheet" id="sheet"></div></div>
<div class="layer" id="actionLayer"><div class="sheet action-sheet" id="actionSheet"></div></div>
<div class="layer dialog-layer" id="dialogLayer"><div class="dialog" id="dialog"></div></div>
<div class="toast-layer" id="toastLayer"></div>

<script>
/* =========================================================================
   1. 基础工具
   ========================================================================= */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const num = n => (Number(n) || 0).toLocaleString('zh-CN', { maximumFractionDigits: 2 });
const fmt = n => '¥' + num(n);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let _userActivated = false;
['touchstart', 'pointerdown', 'click', 'keydown'].forEach(ev =>
  document.addEventListener(ev, () => { _userActivated = true; }, { once: true, passive: true }));
const haptic = (ms = 8) => {
  if (!_userActivated) return;                       // 没交互过就调 vibrate，Chrome 会往控制台报错
  try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {}
};

function monthKey(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function thisMonthKey() { return monthKey(new Date()); }
function monthLabel(d) { return d.getFullYear() + '年' + (d.getMonth() + 1) + '月'; }
function fmtDate(s) {
  if (!s) return '';
  const p = String(s).split('-');
  if (p.length < 3) return s;
  return parseInt(p[1]) + '月' + parseInt(p[2]) + '日';
}
function fmtMonth(m) {
  if (!m) return '未定';
  const p = String(m).split('-');
  const y = parseInt(p[0]), mo = parseInt(p[1]);
  return mo + '月' + (y === new Date().getFullYear() ? '' : ' ' + y);
}
/* 日期键：YYYY-MM-DD。抽签、动态分组都用它做「同一天」的判据 */
function dayKey(d) {
  const t = d || new Date();
  return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');
}
/* 今天零点（本地时区），算天数差用 */
function todayStart() { const d = new Date(); d.setHours(0, 0, 0, 0); return d; }
/* 距离某天还有多少天：正数=未来，0=今天，负数=已过 */
function daysFromToday(dateStr) {
  const p = String(dateStr || '').split('-');
  if (p.length < 3) return null;
  const t = new Date(parseInt(p[0]), parseInt(p[1]) - 1, parseInt(p[2]));
  if (isNaN(t.getTime())) return null;
  t.setHours(0, 0, 0, 0);
  return Math.round((t - todayStart()) / 86400000);
}
/* 金额缩写：一万以上写成「1.2万」，给窄小的坐标轴留位置 */
function numShort(n) {
  const v = Number(n) || 0;
  if (Math.abs(v) >= 10000) {
    const w = v / 10000;
    return (Math.abs(w) >= 100 ? Math.round(w) : Math.round(w * 10) / 10) + '万';
  }
  return String(Math.round(v));
}
/* 月份键加减：'2026-09' + 1 → '2026-10' */
function shiftMonthKey(key, delta) {
  const p = String(key || '').split('-');
  if (p.length < 2) return '';
  return monthKey(new Date(parseInt(p[0]), parseInt(p[1]) - 1 + delta, 1));
}
/* 从 a 到 b（含两端）的连续月份键 */
function spanMonthKeys(a, b) {
  const out = [];
  if (!a || !b) return out;
  let cur = a, guard = 0;
  while (cur <= b && guard++ < 400) { out.push(cur); cur = shiftMonthKey(cur, 1); }
  return out;
}
/* 稳定的字符串散列 → 同一天永远得到同一签 */
function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* =========================================================================
   2. 数据层
   ========================================================================= */
const STORE_KEY = 'commission_tracker_v3';
const LEGACY_KEY = 'commission_tracker_v2';
const freshState = () => ({
  version: 3, commissions: [], guarantees: [], wishes: [], dates: [],
  activity: [],   // 操作流水：付款 / 打勾 / 新增 / 删除，用于「近期动态」
  prefs: {
    theme: 'light', view: 'dashboard', a2hsDismissed: 0,
    monthOrder: 'asc', hideDone: false,
    trendRange: '6', trendMetric: 'amt',   // 趋势图：时间区间 / 统计维度
    drawDate: '',                           // 玄学抽签：最后一次抽签的日期
    labOrder: null                          // 实验室分栏顺序；null = 用默认顺序
  }
});
let MIGRATED = 0;   // 从旧版导入的条数（用于首屏提示）

/* ---- 旧版数据归一化：字段名与 V12 完全一致，这里只做防御性清洗 ---- */
function normalizeComm(c) {
  if (!c || typeof c !== 'object') return null;
  const title = String(c.title || '').trim();
  if (!title) return null;
  return {
    id: c.id || uid(),
    title,
    artist: String(c.artist || ''),
    total: Number(c.total) || 0,
    paid: Number(c.paid) || 0,
    month: typeof c.month === 'string' ? c.month : '',
    date: typeof c.date === 'string' ? c.date : '',
    notes: String(c.notes || ''),
    stalled: !!c.stalled,     // 画师失联，先放一边：不参与交稿雷达
    milestones: Array.isArray(c.milestones)
      ? c.milestones.filter(m => m && (m.name || m.done)).map(m => ({ name: String(m.name || '节点'), done: !!m.done }))
      : []
  };
}
function normalizeGuarantee(g) {
  if (!g || typeof g !== 'object') return null;
  const artist = String(g.artist || '').trim();
  if (!artist) return null;
  return { id: g.id || ('g_' + uid()), artist, price: Number(g.price) || 0, note: String(g.note || ''), done: !!g.done };
}
function normalizeWish(w) {
  if (!w || typeof w !== 'object') return null;
  const title = String(w.title || '').trim();
  if (!title) return null;
  return { id: w.id || ('w_' + uid()), title, artist: String(w.artist || ''), estPrice: Number(w.estPrice) || 0, note: String(w.note || ''), done: !!w.done };
}
const readJSON = k => { try { const v = JSON.parse(localStorage.getItem(k) || 'null'); return v; } catch (e) { return null; } };

function loadState() {
  const s = freshState();
  /* ① 已有新版数据 → 直接用 */
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      s.commissions = Array.isArray(d.commissions) ? d.commissions : [];
      s.guarantees = Array.isArray(d.guarantees) ? d.guarantees : [];
      s.wishes = Array.isArray(d.wishes) ? d.wishes : [];
      s.dates = Array.isArray(d.dates) ? d.dates : [];
      s.prefs = Object.assign(s.prefs, d.prefs || {});
      return s;
    }
  } catch (e) { /* 新版数据损坏 → 尝试从旧版恢复 */ }

  /* ② 首次升级：从 V12 的三个键一次性搬过来（只读，不删旧数据，方便回滚） */
  const oldComms = readJSON(LEGACY_KEY);
  const oldG = readJSON('guarantee_cards');
  const oldW = readJSON('wishes');
  const hasLegacy = Array.isArray(oldComms) || Array.isArray(oldG) || Array.isArray(oldW);
  if (hasLegacy) {
    if (Array.isArray(oldComms)) s.commissions = oldComms.map(normalizeComm).filter(Boolean);
    if (Array.isArray(oldG)) s.guarantees = oldG.map(normalizeGuarantee).filter(Boolean);
    if (Array.isArray(oldW)) s.wishes = oldW.map(normalizeWish).filter(Boolean);
    try {
      const t = localStorage.getItem('app_theme');
      if (t === 'boqiao') s.prefs.theme = 'mintchoco';
      else if (t === 'default') s.prefs.theme = 'light';
    } catch (e) {}
    MIGRATED = s.commissions.length + s.guarantees.length + s.wishes.length;
    try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) {}   // 立刻落盘，别等 120ms 的防抖
  }
  return s;
}
let S = loadState();
let saveTimer = null;
function save(now) {
  const run = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { toast('⚠️ 保存失败，存储空间可能已满'); } };
  if (now) { run(); return; }
  clearTimeout(saveTimer); saveTimer = setTimeout(run, 120);
}
const findComm = id => S.commissions.find(c => c.id === id);
const remainingOf = c => Math.max(0, (Number(c.total) || 0) - (Number(c.paid) || 0));
const statusOf = c => remainingOf(c) <= 0 ? 'done' : 'pending';

/* ---- 状态文案：付款状态 × 绘制进度 ----
   已结清，绘制中 / 待付尾款，绘制中 / 待付款 / 已完稿
   两条规则：
   · 钱没到位（待付款）时画师不会开画，所以不提「绘制中」
   · 完稿必然意味着结清，所以不再重复标「已结清」 */
function isAllDone(c) { return !!(c.milestones && c.milestones.length && c.milestones.every(m => m.done)); }
function payLabel(c) {
  if (remainingOf(c) <= 0) return '已结清';
  return (Number(c.paid) > 0) ? '待付尾款' : '待付款';
}
function progressLabel(c) { return isAllDone(c) ? '已完稿' : '绘制中'; }
function statusLabel(c) {
  if (isAllDone(c)) return remainingOf(c) <= 0 ? '已完稿' : '已完稿，待付款';   // 后者是异常数据，留个提示
  const y = payLabel(c);
  return y === '待付款' ? '待付款' : y + '，绘制中';
}
/* 「完结订单」= 钱结清 + 稿完稿，总览页与稿件页的「隐藏」都以它为准 */
const isDoneOrder = c => isAllDone(c) && remainingOf(c) <= 0;
/* 付款状态的色调：已结清=绿 / 待付尾款=橙 / 待付款=红 */
function payTone(c) { const y = payLabel(c); return y === '已结清' ? 'done' : (y === '待付尾款' ? 'pending' : 'unpaid'); }

/* ---- 操作流水 ----------------------------------------------------------
   给「近期动态」用的轻量日志。只在真正发生事情的时候记一笔：
   新增稿件 / 付款 / 打勾节点 / 一键完稿 / 删除。
   纯编辑（改名字、改备注）不记，免得把动态刷成噪声。 */
const ACT_MAX = 300;
function logAct(type, comm, extra) {
  if (!Array.isArray(S.activity)) S.activity = [];
  S.activity.unshift(Object.assign({
    id: uid(), at: Date.now(), type,
    commId: (comm && comm.id) || '',
    title: (comm && comm.title) || '',
    artist: (comm && comm.artist) || ''
  }, extra || {}));
  if (S.activity.length > ACT_MAX) S.activity.length = ACT_MAX;   // 只留最近 300 条
}

/* =========================================================================
   3. 主题
   ========================================================================= */
const THEMES = [
  { id: 'light',     name: '极简白',   desc: '干净利落',           dots: ['#ffffff', '#5856d6', '#1d1d1f'], color: '#f2f2f7' },
  { id: 'mintchoco', name: '薄巧',     desc: '薄荷 × 巧克力',       dots: ['#e6f4ec', '#2a8f6f', '#3a2b23'], color: '#eaf3ee' },
  { id: 'sea',       name: '海盐',     desc: '清爽蓝调',           dots: ['#e8f2fa', '#2b76c9', '#1b2733'], color: '#eef5fa' },
  { id: 'peach',     name: '蜜桃乌龙', desc: '温柔暖橘',           dots: ['#fdeee6', '#c9613c', '#3a2a22'], color: '#fdf1ea' },
  { id: 'matcha',    name: '抹茶拿铁', desc: '低饱和绿',           dots: ['#eef1e2', '#5f8437', '#2f3524'], color: '#f0f3e6' },
  { id: 'lavender',  name: '薰衣草',   desc: '梦幻紫',             dots: ['#efeafa', '#6a55c9', '#2b2540'], color: '#f1ecfb' },
  { id: 'sakura',    name: '樱花',     desc: '软糯粉',             dots: ['#fce8ee', '#c94a76', '#3a2630'], color: '#fceef2' },
  { id: 'night',     name: '深夜',     desc: '护眼深色模式',       dots: ['#1b1d28', '#7aa2f7', '#e6e8f2'], color: '#13141c', dark: true }
];

function applyTheme(id) {
  const t = THEMES.find(x => x.id === id) || THEMES[0];
  document.documentElement.setAttribute('data-theme', t.id);
  document.documentElement.style.colorScheme = t.dark ? 'dark' : 'light';
  const meta = $('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', t.color);
  S.prefs.theme = t.id; save();
  buildIcon();
}

/* =========================================================================
   动态生成 App 图标（跟随主题配色）
   设计：渐变底（左上柔光 + 右下暗角）+ 白色收据（锯齿底）+ 右下角金币
   - apple-touch-icon 用满幅方块：iOS 自己会裁 squircle，自带圆角反而被二次裁切
   - favicon 用圆角版，浏览器标签里才好看
   ========================================================================= */
let ICONS = {};
function iconRGB(h) {
  let s = String(h || '').replace('#', '').trim();
  if (s.length === 3) s = s.split('').map(c => c + c).join('');
  if (!/^[0-9a-f]{6}$/i.test(s)) s = '5856d6';
  return [parseInt(s.slice(0, 2), 16), parseInt(s.slice(2, 4), 16), parseInt(s.slice(4, 6), 16)];
}
function iconMix(h, target, k) {
  const x = iconRGB(h), y = iconRGB(target);
  return '#' + x.map((v, i) => Math.max(0, Math.min(255, Math.round(v + (y[i] - v) * k))).toString(16).padStart(2, '0')).join('');
}
function buildIcon() {
  try {
    const cs = getComputedStyle(document.documentElement);
    const raw = cs.getPropertyValue('--accent').trim() || '#5856d6';
    /* 主题色偏亮（如「深夜」的浅蓝）时压暗，保证白色主体有对比度 */
    const c = iconRGB(raw);
    const lum = (c[0] * .299 + c[1] * .587 + c[2] * .114) / 255;
    const k = lum > .72 ? .40 : (lum > .58 ? .26 : 0);
    const base = k ? iconMix(raw, '#000000', k) : raw;
    const top = iconMix(base, '#ffffff', .26);
    const bot = iconMix(base, '#000000', .34);
    const tint = (amt) => 'rgba(' + iconRGB(base).join(',') + ',' + amt + ')';
    const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif';

    function paint(size, radius) {
      const S = size;
      const cv = document.createElement('canvas');
      cv.width = cv.height = S;
      const g = cv.getContext('2d');
      const rr = (x, y, w, h, r) => {
        r = Math.max(0, Math.min(r, w / 2, h / 2));
        g.beginPath();
        g.moveTo(x + r, y);
        g.arcTo(x + w, y, x + w, y + h, r);
        g.arcTo(x + w, y + h, x, y + h, r);
        g.arcTo(x, y + h, x, y, r);
        g.arcTo(x, y, x + w, y, r);
        g.closePath();
      };
      const shadow = (a, blur, dy) => {
        g.shadowColor = 'rgba(0,0,0,' + a + ')';
        g.shadowBlur = S * blur; g.shadowOffsetY = S * dy;
      };
      /* ① 底色：斜向三段渐变 + 左上柔光 + 右下暗角 */
      g.save();
      rr(0, 0, S, S, radius); g.clip();
      const lg = g.createLinearGradient(0, 0, S, S);
      lg.addColorStop(0, top); lg.addColorStop(.52, base); lg.addColorStop(1, bot);
      g.fillStyle = lg; g.fillRect(0, 0, S, S);
      const rg = g.createRadialGradient(S * .2, S * .14, 0, S * .2, S * .14, S * .95);
      rg.addColorStop(0, 'rgba(255,255,255,.32)');
      rg.addColorStop(.5, 'rgba(255,255,255,.07)');
      rg.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = rg; g.fillRect(0, 0, S, S);
      const vg = g.createRadialGradient(S * .9, S * .94, 0, S * .9, S * .94, S);
      vg.addColorStop(0, 'rgba(0,0,0,.18)'); vg.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = vg; g.fillRect(0, 0, S, S);
      g.restore();

      /* ② 收据：上圆角 + 下锯齿（锯齿就是收据的标志） */
      const w = S * .52, h = S * .60, x = (S - w) / 2 - S * .035, y = S * .165;
      const rad = S * .06, zh = S * .055, n = 4;
      g.save();
      shadow(.28, .07, .025);
      g.fillStyle = '#fff';
      g.beginPath();
      g.moveTo(x + rad, y);
      g.lineTo(x + w - rad, y);
      g.arcTo(x + w, y, x + w, y + rad, rad);
      g.lineTo(x + w, y + h);
      for (let i = n; i >= 1; i--) {
        g.lineTo(x + w * (i - .5) / n, y + h - zh);
        g.lineTo(x + w * (i - 1) / n, y + h);
      }
      g.lineTo(x, y + rad);
      g.arcTo(x, y, x + rad, y, rad);
      g.closePath();
      g.fill();
      g.restore();

      /* ③ 收据上的两条横线：只留两条并加粗，缩小后不会糊成脏点 */
      const lx = x + w * .19, lw = w * .62, lh = S * .046;
      g.fillStyle = tint(.24);
      rr(lx, y + h * .28, lw, lh, lh / 2); g.fill();
      rr(lx, y + h * .50, lw * .54, lh, lh / 2); g.fill();

      /* ④ 右下角金币：只压住收据的一角，别把锯齿盖没了 */
      const cr = S * .16, cx = x + w * .99, cy = y + h * .99;
      const cg = g.createLinearGradient(cx - cr, cy - cr, cx + cr, cy + cr);
      cg.addColorStop(0, '#ffe79b'); cg.addColorStop(.55, '#f7c94a'); cg.addColorStop(1, '#dd9c18');
      g.save();
      shadow(.30, .07, .025);
      g.fillStyle = cg;
      g.beginPath(); g.arc(cx, cy, cr, 0, Math.PI * 2); g.fill();
      g.restore();
      g.fillStyle = '#fff';
      g.font = '700 ' + Math.round(S * .175) + 'px ' + FONT;
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText('¥', cx, cy + S * .006);

      return cv.toDataURL('image/png');
    }

    ICONS = {
      touch: paint(180, 0),        // iOS 主屏幕：满幅，交给系统裁 squircle
      p192: paint(192, 0),
      p512: paint(512, 0),
      fav: paint(128, 128 * .235)  // 浏览器标签：自带圆角
    };

    let link = $('link[rel="apple-touch-icon"]');
    if (!link) { link = document.createElement('link'); link.rel = 'apple-touch-icon'; document.head.appendChild(link); }
    link.setAttribute('sizes', '180x180');
    link.href = ICONS.touch;
    let fav = $('link[rel="icon"]');
    if (!fav) { fav = document.createElement('link'); fav.rel = 'icon'; fav.type = 'image/png'; document.head.appendChild(fav); }
    fav.href = ICONS.fav;
  } catch (e) {}
}

function openThemeSheet() {
  const body = `
    <div class="theme-grid">
      ${THEMES.map(t => `
        <div class="theme-card ${S.prefs.theme === t.id ? 'active' : ''}" data-act="set-theme" data-id="${t.id}">
          ${S.prefs.theme === t.id ? '<span class="tc-check">✓</span>' : ''}
          <div class="tc-dots">${t.dots.map(d => `<span class="tc-dot" style="background:${d}"></span>`).join('')}</div>
          <div class="tc-name">${t.name}</div>
          <div class="tc-desc">${t.desc}</div>
        </div>`).join('')}
    </div>
    <div class="spacer"></div>
    <div class="sheet-note">配色即时生效，会自动记住你的选择。深色模式适合夜里记账 🌙</div>`;
  Sheet.open({ title: '🎨 配色主题', body, footer: `<button class="btn btn-primary btn-block" data-act="close-sheet">完成</button>` });
}

/* =========================================================================
   4. UI 组件：Toast / Dialog / ActionSheet / Sheet
   ========================================================================= */
let toastTimer = null;
function toast(msg, icon) {
  const layer = $('#toastLayer');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = (icon ? `<span>${icon}</span>` : '') + `<span>${esc(msg)}</span>`;
  layer.appendChild(el);
  haptic(6);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 260); }, 1900);
}

function confirmDialog({ title = '确认', message = '', okText = '确定', cancelText = '取消', danger = false }) {
  return new Promise(resolve => {
    const layer = $('#dialogLayer'), box = $('#dialog');
    box.innerHTML = `
      <h3>${esc(title)}</h3>
      <p>${esc(message)}</p>
      <div class="dialog-actions">
        <button class="btn btn-ghost" data-dlg="0">${esc(cancelText)}</button>
        <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-dlg="1">${esc(okText)}</button>
      </div>`;
    layer.classList.add('show');
    const done = v => {
      layer.classList.remove('show');
      box.innerHTML = '';
      layer.removeEventListener('click', onClick);
      resolve(v);
    };
    const onClick = e => {
      if (e.target === layer) return done(false);
      const b = e.target.closest('[data-dlg]');
      if (b) { haptic(8); done(b.dataset.dlg === '1'); }
    };
    layer.addEventListener('click', onClick);
  });
}

function actionSheet({ title = '', items = [] }) {
  const layer = $('#actionLayer'), box = $('#actionSheet');
  if (layer._onClick) layer.removeEventListener('click', layer._onClick);
  box.innerHTML = `
    ${title ? `<div class="action-title">${esc(title)}</div>` : ''}
    ${items.map((it, i) => `<button class="action-item ${it.danger ? 'danger' : ''}" data-i="${i}"><span class="ai">${it.icon || ''}</span><span>${esc(it.label)}</span></button>`).join('')}
    <button class="action-cancel" data-i="-1">取消</button>`;
  layer.classList.add('show');
  requestAnimationFrame(() => box.classList.add('show'));
  const close = () => {
    box.classList.remove('show');
    setTimeout(() => {
      layer.classList.remove('show');
      box.innerHTML = '';
      if (layer._onClick) { layer.removeEventListener('click', layer._onClick); layer._onClick = null; }
    }, 280);
  };
  const onClick = e => {
    if (e.target === layer) return close();
    const b = e.target.closest('[data-i]');
    if (!b) return;
    const i = parseInt(b.dataset.i);
    close();
    if (i >= 0 && items[i]) { haptic(10); setTimeout(items[i].act, 180); }
  };
  layer._onClick = onClick;
  layer.addEventListener('click', onClick);
}

const Sheet = (() => {
  const layer = $('#sheetLayer'), el = $('#sheet');
  let dragY = 0, startY = 0, dragging = false;
  let seq = 0;

  function open({ title = '', body = '', footer = '', onMount }) {
    seq++;
    el.innerHTML = `
      <div class="sheet-grab"><div class="sheet-handle"></div></div>
      ${title ? `<h2 class="sheet-title">${title}</h2>` : ''}
      <div class="sheet-body">${body}</div>
      ${footer ? `<div class="sheet-footer">${footer}</div>` : ''}`;
    layer.classList.add('show');
    requestAnimationFrame(() => el.classList.add('show'));
    el.querySelector('.sheet-body').scrollTop = 0;
    if (onMount) onMount(el);
  }
  function close() {
    const my = seq;
    el.classList.remove('show');
    setTimeout(() => {
      if (seq !== my) return;          // 期间又打开了新弹窗，别误关
      layer.classList.remove('show');
      el.innerHTML = '';
    }, 320);
  }
  function onStart(e) {
    if (layer._locked) return;
    dragging = true; startY = e.touches[0].clientY; dragY = 0;
    el.classList.add('dragging');
  }
  function onMove(e) {
    if (!dragging) return;
    dragY = Math.max(0, e.touches[0].clientY - startY);
    el.style.transform = `translateY(${dragY}px)`;
  }
  function onEnd() {
    if (!dragging) return;
    dragging = false;
    el.classList.remove('dragging');
    el.style.transform = '';
    if (dragY > 110) close();
  }
  layer.addEventListener('click', e => { if (e.target === layer) close(); });
  el.addEventListener('touchstart', e => { if (e.target.closest('.sheet-grab')) onStart(e); }, { passive: true });
  el.addEventListener('touchmove', onMove, { passive: true });
  el.addEventListener('touchend', onEnd);
  return { open, close, el };
})();

function closeAllLayers() { Sheet.close(); }

function renderList() {
  const asc = isMonthAsc();

    paid: S.commissions.filter(c => statusOf(c) === 'done').length,

  };

      `<button class="chip ${listFilter === k ? 'active' : ''}" data-act="filter" data-id="${k}">${l}<span class="chip-n">${cnt[k]}</span></button>`).join('') +
    months.map(m => `<button class="chip ${listFilter === m ? 'active' : ''}" data-act="filter" data-id="${m}">${fmtMonth(m)}</button>`).join('');
  bindEdgeFade($('#filterChips'));

  const hideDone = !!S.prefs.hideDone;

  let list = S.commissions.filter(c => {
    const title = (c.title || '').toLowerCase(), artist = (c.artist || '').toLowerCase();
    if (q && !(title.includes(q) || artist.includes(q))) return false;
    if (hideDone && isDoneOrder(c)) return false;              // 「隐藏已完成」和分类筛选是叠加关系
    if (listFilter === 'pending' && statusOf(c) !== 'pending') return false;
    if (listFilter === 'paid' && statusOf(c) !== 'done') return false;
    if (listFilter === 'undone' && isAllDone(c)) return false;
    if (listFilter === 'alldone' && !isAllDone(c)) return false;
    if (named.indexOf(listFilter) < 0 && c.month !== listFilter) return false;
    return true;
  }).sort((a, b) => {
    const ma = a.month || '', mb = b.month || '';
    if (!ma) return mb ? 1 : 0;               // 未知月份永远垫底
    if (!mb) return -1;
    const mc = asc ? ma.localeCompare(mb) : mb.localeCompare(ma);

    if (!da) return db ? 1 : 0;
    if (!db) return -1;
    return asc ? da.localeCompare(db) : db.localeCompare(da);
  });

  const box = $('#listContainer');

        : emptyState('🎨', '还没有稿件记录', '点右下角 + 添加', 'add', '+ 新增稿件');
    }
    return;
  }
  box.innerHTML = list.map(commCardHTML).join('');
