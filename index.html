function niceRound(n) {
  if (n <= 0) return 0;
  const a = Math.round(n);
  if (a >= 10000) return Math.ceil(a / 500) * 500;
  if (a >= 1000) return Math.ceil(a / 100) * 100;
  if (a >= 500) return Math.ceil(a / 50) * 50;
  if (a >= 100) return Math.ceil(a / 10) * 10;
  return Math.ceil(a / 5) * 5;
}
function calcOffline() {
  const n = parseFloat($('#calcTotal').value) || 0;
  const p = parseFloat($('#calcPlatform').value) || 0;
  const offline = (n - p) * (1 - FEE);
  const origFee = n * FEE, actualFee = p * FEE, savedFee = origFee - actualFee;
  const recommended = niceRound(offline);

  const el = $('#calcAmount');
  el.textContent = fmt(offline);
  el.className = 'amount ' + (offline > 0 ? 'red' : 'green');

  const bd = $('#calcBreakdown');
  if (n <= 0 && p <= 0) { bd.innerHTML = ''; return; }
  bd.innerHTML = `
    <div class="breakdown-row green-row">
      <span class="b-label">💚 节省的手续费<br><span style="font-size:11px">原手续费 ${num(origFee)} − 平台手续费 ${num(actualFee)}</span></span>
      <span class="b-value">${fmt(savedFee)}</span>
    </div>
    <div class="breakdown-row highlight">
      <span class="b-label">✨ 推荐转账金额<br><span style="font-size:11px">凑整抹零</span></span>
      <span class="b-value">${fmt(recommended)}</span>
    </div>`;
}

let currentLab = 'feed';

/* 分栏的权威定义。默认顺序把「每天都会看一眼」的放前面：
   动态（下一个谁交稿）→ 抽签（今天有没有人交稿）→ 趋势（复盘），
   压力/保送卡/画饼/纪念日这些按周按月才看的排后面。
   用户可以自己排，顺序存在 prefs.labOrder 里 */
const LAB_TABS = [
  { id: 'feed',      label: '🕒 动态' },
  { id: 'fortune',   label: '🔮 抽签' },
  { id: 'trend',     label: '📈 趋势' },
  { id: 'pressure',  label: '😰 压力' },
  { id: 'guarantee', label: '🎫 保送卡' },
  { id: 'wishes',    label: '🥞 画饼' },
  { id: 'dates',     label: '🎂 纪念日' }
];
const LAB_IDS = LAB_TABS.map(t => t.id);
const labLabel = id => (LAB_TABS.find(t => t.id === id) || { label: id }).label;

/* 读顺序：过滤掉不认识的 id（版本升级后删掉的分栏），再把缺的补到末尾，
   保证任何一份历史数据都能得到一份完整且不重复的顺序 */
function labOrder() {
  const saved = Array.isArray(S.prefs.labOrder) ? S.prefs.labOrder.filter(x => LAB_IDS.indexOf(x) >= 0) : [];
  const uniq = saved.filter((x, i) => saved.indexOf(x) === i);
  return uniq.concat(LAB_IDS.filter(x => uniq.indexOf(x) < 0));
}
function syncSegActive() {
  $$('.seg-btn').forEach(b => b.classList.toggle('active', b.dataset.lab === currentLab));
}
/* 只在顺序真的变了的时候重建 DOM —— 每次切栏都重建会把滚动位置和动画都打乱 */
function renderSegControl() {
  const el = $('#segControl');
  if (!el) return;
  const order = labOrder();
  const cur = $$('.seg-btn', el).map(b => b.dataset.lab);
  if (cur.join(',') === order.join(',')) { syncSegActive(); return; }
  el.innerHTML = order.map(id =>
    `<button class="seg-btn" data-act="lab" data-lab="${id}">${labLabel(id)}</button>`).join('');
  syncSegActive();
  syncSegRail();
  syncEdgeFade(el);
}
function renderLab() {
  renderSegControl();          // 顺序可能刚被调过，进来先对齐分栏
  /* 从别的页面切进来时没人负责切 .lab-sub，这里统一收口 */
  $$('.lab-sub').forEach(s => s.classList.toggle('active', s.id === 'lab-' + currentLab));
  if (currentLab === 'pressure') renderPressure();
  else if (currentLab === 'guarantee') renderGuarantee();
  else if (currentLab === 'wishes') renderWishes();
  else if (currentLab === 'dates') renderDates();
  else if (currentLab === 'trend') renderTrend();
  else if (currentLab === 'feed') renderFeed();
  else if (currentLab === 'fortune') renderFortune();
}
function switchLab(sub) {
  if (LAB_IDS.indexOf(sub) < 0) sub = LAB_IDS[0];
  currentLab = sub;
  renderLab();
  /* 分栏多了要横滑，切到看不见的那一栏时把按钮滚到中间。
     block:'nearest' 是为了别把整页也一起滚上去 */
  const btn = $(`.seg-btn[data-lab="${sub}"]`);
  if (btn && btn.scrollIntoView) {
    try { btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' }); } catch (e) {}
  }
  /* 滑条和两端渐隐都挂在 scroll 事件上，平滑滚动时会自己跟上，这里不用再手动同步 */
}

  Sheet.open({ title: '⇄ 实验室分栏顺序', body, footer });

function renderOrderList() {
  const box = $('#orderList');

  const order = labOrder();

function moveLabOrder(id, dir) {
  const order = labOrder();
  const i = order.indexOf(id), j = i + dir;
  if (i < 0 || j < 0 || j >= order.length) return;
  order[i] = order[j]; order[j] = id;
  S.prefs.labOrder = order;
  save(true);
  renderOrderList();
  renderSegControl();
  haptic();
}

/* 自绘滑条：宽度按可视比例，位置按滚动进度。放得下就整条藏起来 */
function syncSegRail() {
  const el = $('#segControl'), rail = $('#segRail'), thumb = $('#segThumb');
  if (!el || !rail || !thumb) return;
  const max = el.scrollWidth - el.clientWidth;
  if (max <= 1) { rail.style.visibility = 'hidden'; return; }
  rail.style.visibility = 'visible';
  const rw = rail.clientWidth;
  const tw = Math.max(26, Math.round(rw * el.clientWidth / el.scrollWidth));
  thumb.style.width = tw + 'px';
  thumb.style.transform = 'translateX(' + Math.round(el.scrollLeft / max * (rw - tw)) + 'px)';
}

/* 横滑容器的两端渐隐：告诉用户「这边还有东西」。
   原生滚动条在 Chrome 上是 overlay，不滚动就看不见，只能自己给提示 */
function syncEdgeFade(el) {
  if (!el) return;
  const max = el.scrollWidth - el.clientWidth;
  const more = max > 1;
  el.classList.toggle('fade-l', more && el.scrollLeft > 1);
  el.classList.toggle('fade-r', more && el.scrollLeft < max - 1);
}
function bindEdgeFade(el) {
  if (!el || el.dataset.fadeBound) return;
  el.dataset.fadeBound = '1';
  el.addEventListener('scroll', () => syncEdgeFade(el), { passive: true });
  window.addEventListener('resize', () => syncEdgeFade(el));
  syncEdgeFade(el);
}
/* 拖动滑条 = 拖动分栏（手机上分栏本身也能直接滑，这里主要是给鼠标用） */
function bindSegRail() {
  const el = $('#segControl'), rail = $('#segRail');
  if (!el || !rail) return;
  el.addEventListener('scroll', syncSegRail, { passive: true });
  window.addEventListener('resize', syncSegRail);
  let drag = null;
  rail.addEventListener('pointerdown', e => {
    drag = { x: e.clientX, left: el.scrollLeft };
    try { rail.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  });
  rail.addEventListener('pointermove', e => {
    if (!drag) return;
    const max = el.scrollWidth - el.clientWidth;
    const room = rail.clientWidth - ($('#segThumb').offsetWidth || 0);
    if (max <= 0 || room <= 0) return;
    el.scrollLeft = drag.left + (e.clientX - drag.x) / room * max;
  });
  const stop = () => { drag = null; };
  rail.addEventListener('pointerup', stop);
  rail.addEventListener('pointercancel', stop);
  syncSegRail();
  bindEdgeFade(el);
}

/* ---- 尾款压力 ---- */
function renderPressure() {
  const mk = thisMonthKey();
  const auto = S.commissions.filter(c => c.month === mk && remainingOf(c) > 0)
    .reduce((s, c) => s + remainingOf(c), 0);
  const tail = $('#pr_tail');
  if (!tail.dataset.touched) tail.value = auto || '';
  $('#prAutoFill').textContent = '自动 ' + fmt(auto);
  calcPressure();
}
function calcPressure() {
  const v = id => parseFloat($('#' + id).value) || 0;
  const salary = v('pr_salary'), otherIncome = v('pr_other_income');
  const otherExpense = v('pr_other_expense'), tail = v('pr_tail');
  const totalIncome = salary + otherIncome;
  const balance = totalIncome - otherExpense - tail;

  const resultEl = $('#pressureResult'), bdEl = $('#pressureBreakdown');
  if (!(salary || otherIncome || otherExpense || tail)) {
    resultEl.style.display = 'none'; bdEl.style.display = 'none'; return;
  }

  let cls, emoji, verdict, detail;
  if (balance > 0) {
    if (balance > totalIncome * 0.3) { cls = 'safe'; emoji = '😊'; verdict = '压力不大'; detail = `本月可结余 ${fmt(balance)}，资金充裕`; }
    else { cls = 'safe'; emoji = '🙂'; verdict = '刚好覆盖'; detail = `结余 ${fmt(balance)}，注意控制额外支出`; }
  } else if (balance === 0) {
    cls = 'warn'; emoji = '😐'; verdict = '刚好持平'; detail = '收支平衡，没有结余空间';
  } else {
    const gap = Math.abs(balance);
    const ratio = totalIncome > 0 ? gap / totalIncome : 1;
    if (ratio < 0.15) { cls = 'warn'; emoji = '😬'; verdict = '略有压力'; detail = `缺口 ${fmt(gap)}，需压缩支出或补收入`; }
    else { cls = 'danger'; emoji = '😰'; verdict = '资金缺口'; detail = `缺口 ${fmt(gap)}，尾款支付有压力`; }
  }

  resultEl.style.display = 'block';
  resultEl.className = 'pressure-result ' + cls;
  resultEl.innerHTML = `<div class="emoji">${emoji}</div><div class="verdict">${verdict}</div><div class="detail">${detail}</div>`;

  bdEl.style.display = 'flex';
  bdEl.innerHTML = `
    <div class="pb-row income"><span class="pb-label">💵 预计工资</span><span class="pb-value">+${fmt(salary)}</span></div>
    <div class="pb-row income"><span class="pb-label">💼 其他收入</span><span class="pb-value">+${fmt(otherIncome)}</span></div>
    <div class="pb-divider"></div>
    <div class="pb-row expense"><span class="pb-label">🏠 其他固定支出</span><span class="pb-value">-${fmt(otherExpense)}</span></div>
    <div class="pb-row expense"><span class="pb-label">🎨 本月尾款</span><span class="pb-value">-${fmt(tail)}</span></div>
    <div class="pb-divider"></div>
    <div class="pb-row ${balance >= 0 ? 'income' : 'expense'}" style="background:${balance >= 0 ? 'var(--green-soft)' : 'var(--red-soft)'}">
      <span class="pb-label" style="font-weight:600;color:var(--text)">${balance >= 0 ? '✅ 可用余额' : '⚠️ 资金缺口'}</span>
      <span class="pb-value" style="font-size:18px">${balance >= 0 ? '+' : '-'}${fmt(Math.abs(balance))}</span>
    </div>`;
}

/* ---- 纪念日 / 生日倒数日 ---- */
const DATE_TYPES = {
  birthday:    { icon: '🎂', label: '生日' },
  anniversary: { icon: '💞', label: '纪念日' },
  oc:          { icon: '🎨', label: 'OC / 角色日' },
  once:        { icon: '📌', label: '单次' }
};
const isRepeat = t => t !== 'once';
function nextOccurrence(dateStr, repeat) {
  const p = String(dateStr || '').split('-');
  if (p.length < 3) return null;
  const mo = parseInt(p[1]) - 1, d = parseInt(p[2]);
  if (isNaN(mo) || isNaN(d)) return null;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  if (!repeat) return new Date(parseInt(p[0]), mo, d);
  let t = new Date(today.getFullYear(), mo, d);
  if (t < today) t = new Date(today.getFullYear() + 1, mo, d);
  return t;
}
function daysUntil(item) {
  const t = nextOccurrence(item.date, isRepeat(item.type));
  if (!t) return null;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  return Math.round((t - today) / 86400000);
}
function countdownText(n) {
  if (n === null) return '未设置日期';
  if (n === 0) return '🎉 就是今天';
  if (n === 1) return '明天';
  if (n > 0) return '还有 ' + n + ' 天';
  return '已过 ' + Math.abs(n) + ' 天';
}
function linkedStats(item) {
  const list = (item.linked || []).map(findComm).filter(Boolean);
  const total = list.reduce((s, c) => s + (Number(c.total) || 0), 0);
  const unpaid = list.reduce((s, c) => s + remainingOf(c), 0);
  return { list, total, unpaid };
}
function renderDates() {
  const box = $('#datesList');
  if (!S.dates.length) { box.innerHTML = emptyState('🎂', '还没有纪念日', '亲友生日、OC 纪念日，记下来倒着数', 'add-date', '+ 添加纪念日'); return; }
  const sorted = S.dates.slice().sort((a, b) => {
    const da = daysUntil(a), db = daysUntil(b);
    return (da === null ? 99999 : da) - (db === null ? 99999 : db);
  });
  box.innerHTML = sorted.map(d => {
    const n = daysUntil(d), tp = DATE_TYPES[d.type] || DATE_TYPES.birthday;
    const st = linkedStats(d);
    const near = n !== null && n >= 0 && n <= 30;
    const occ = nextOccurrence(d.date, isRepeat(d.type));
    return `<div class="gcard ${near ? 'date-near' : ''}" data-act="edit-date" data-id="${d.id}">
      <div class="gcard-top">
        <div style="min-width:0;">
          <div class="gcard-title">${tp.icon} ${esc(d.name)}</div>
          <div class="gcard-meta">${tp.label}${occ ? ' · ' + (occ.getMonth() + 1) + '月' + occ.getDate() + '日' : ''}${isRepeat(d.type) ? '（每年）' : ''}</div>
        </div>
        <div style="text-align:right;flex-shrink:0;">
          <div class="cd-num ${near ? 'near' : ''}">${n === 0 ? '今天' : (n !== null && n > 0 ? n + ' 天' : (n !== null ? Math.abs(n) + ' 天前' : '—'))}</div>
          <div class="cd-label">${n !== null && n > 0 ? '倒数' : (n === 0 ? '' : '已过')}</div>
        </div>
      </div>
      ${d.note ? `<div class="gcard-note">${esc(d.note)}</div>` : ''}
      ${st.list.length ? `<div class="date-linked">
        <span>🔗 关联 ${st.list.length} 张稿件</span>
        <span>共 <b>${fmt(st.total)}</b>${st.unpaid > 0 ? ` · 待付 <b class="warn">${fmt(st.unpaid)}</b>` : ' · 已结清'}</span>
      </div>` : ''}
      <div class="gcard-actions">
        <button data-act="edit-date" data-id="${d.id}">编辑</button>
        <button class="del-btn" data-act="del-date" data-id="${d.id}">删除</button>
      </div>
    </div>`;
  }).join('') + addBtn('add-date', '+ 添加纪念日');
}

/* ---- 趋势 --------------------------------------------------------------
   老版本是一排横向进度条：只能看出「哪个月多」，看不出钱的构成，也看不出走势，
   月份一多还会挤成一团。现在换成按时间连续的堆叠柱：
   · 缺的月份补零，时间轴不断档，涨跌一眼可见
   · 每根柱子拆成「已付 / 待付」两段，欠了多少一眼看清
   · 点柱子直接看那个月的明细，不用回列表翻
   · 可切区间（近 6 月 / 近 12 月 / 全部）与维度（金额 / 张数） */
const TREND_RANGES = [['6', '近 6 月'], ['12', '近 12 月'], ['all', '全部']];
let trendSel = '';

/* 要画哪些月份。区间内补零连续；「全部」最多回溯 24 个月，免得横滑到天边 */
function trendMonthKeys(range) {
  const keys = S.commissions.map(c => c.month).filter(Boolean).sort();
  if (range === 'all') {
    if (!keys.length) return [];
    const all = spanMonthKeys(keys[0], keys[keys.length - 1]);
    return all.length > 24 ? all.slice(all.length - 24) : all;
  }
  const n = range === '12' ? 12 : 6;
  const end = thisMonthKey();
  return spanMonthKeys(shiftMonthKey(end, -(n - 1)), end);
}

function trendBucket() {
  const metric = S.prefs.trendMetric === 'cnt' ? 'cnt' : 'amt';
  const range = TREND_RANGES.some(r => r[0] === S.prefs.trendRange) ? S.prefs.trendRange : '6';
  const keys = trendMonthKeys(range);
  const map = {};
  keys.forEach(k => { map[k] = { total: 0, paid: 0, unpaid: 0, cnt: 0, cntDone: 0 }; });
  S.commissions.forEach(c => {
    const d = map[c.month];
    if (!d) return;
    const t = Math.max(Number(c.total) || 0, 0);
    const p = Math.min(Math.max(Number(c.paid) || 0, 0), t);   // 多付的钱不算进「已付」，免得柱子超出
    d.total += t; d.paid += p; d.unpaid += t - p;
    d.cnt++;
    if (statusOf(c) === 'done') d.cntDone++;
  });
  return { metric, range, keys, map };
}

function renderTrend() {
  const box = $('#trendChart');
  if (!box) return;
  if (!S.commissions.length) { box.innerHTML = emptyState('📈', '暂无数据', '添加稿件后这里会有统计'); return; }

  const { metric, range, keys, map } = trendBucket();
  const valOf = d => metric === 'cnt' ? d.cnt : d.total;
  const segOf = d => metric === 'cnt' ? { a: d.cntDone, b: d.cnt - d.cntDone } : { a: d.paid, b: d.unpaid };
  const maxV = Math.max(...keys.map(k => valOf(map[k])), 1);
  const withData = keys.filter(k => map[k].cnt > 0);
  const isCnt = metric === 'cnt';
  const unit = v => isCnt ? v + ' 张' : fmt(v);

  const sel = keys.includes(trendSel) ? trendSel : (withData[withData.length - 1] || keys[keys.length - 1] || '');
  trendSel = sel;

  /* 区间合计 */
  const sum = { total: 0, paid: 0, unpaid: 0 };
  keys.forEach(k => { sum.total += map[k].total; sum.paid += map[k].paid; sum.unpaid += map[k].unpaid; });
  const avg = withData.length ? sum.total / withData.length : 0;

  /* 一句话结论：环比 + 峰值月 */
  let note = '';
  if (withData.length >= 2) {
    const last = withData[withData.length - 1], prev = withData[withData.length - 2];
    const c = map[last], p = map[prev];
    const arrow = c.total > p.total ? '↑' : (c.total < p.total ? '↓' : '→');
    const pct = p.total > 0 ? Math.abs(Math.round((c.total - p.total) / p.total * 100)) + '%' : '—';
    note = `${fmtMonth(last)} ${fmt(c.total)}，比 ${fmtMonth(prev)} ${arrow}${pct}；`;
  } else if (withData.length === 1) {
    note = `目前只有 ${fmtMonth(withData[0])} 有记录，共 ${fmt(map[withData[0]].total)}；`;
  }
  let peakKey = '', peakV = -1;
  keys.forEach(k => { const v = valOf(map[k]); if (v > peakV) { peakV = v; peakKey = k; } });
  /* 峰值就是最近这一个月的话，前面那句已经说过了，不用重复 */
  if (peakV > 0 && withData.length > 1 && peakKey !== withData[withData.length - 1]) note += `；最高是 ${fmtMonth(peakKey)}（${unit(peakV)}）`;
  note = note.replace(/；$/, '');

  const yLabels = isCnt
    ? [maxV + '张', Math.round(maxV / 2) + '张', '0']
    : [numShort(maxV), numShort(maxV / 2), '0'];

  const cols = keys.map(k => {
    const d = map[k], s = segOf(d);
    const total = s.a + s.b;
    const on = k === sel;
    if (total <= 0) {
      return `<div class="tp-col ${on ? 'on' : ''}" data-act="trend-pick" data-id="${k}"><div class="tp-stub"></div></div>`;
    }
    const barH = Math.max(3, total / maxV * 100);
    /* column-reverse：先写的排在下边。已付贴底、待付往上叠，读起来才是「还差多少」 */
    return `<div class="tp-col ${on ? 'on' : ''}" data-act="trend-pick" data-id="${k}">
      <div class="tp-bar" style="height:${barH}%">
        ${s.a > 0 ? `<div class="tp-seg seg-a" style="height:${s.a / total * 100}%"></div>` : ''}
        ${s.b > 0 ? `<div class="tp-seg seg-b" style="height:${s.b / total * 100}%"></div>` : ''}
      </div>
    </div>`;
  }).join('');

  const xlabels = keys.map(k =>
    `<div class="tp-xl ${k === sel ? 'on' : ''}">${fmtMonth(k)}${k === thisMonthKey() ? '<i class="tp-now"></i>' : ''}</div>`).join('');

  const d = map[sel] || { total: 0, paid: 0, unpaid: 0, cnt: 0, cntDone: 0 };
  const pct = d.total > 0 ? Math.min(100, Math.round(d.paid / d.total * 100)) : 0;
  const dSub = !d.cnt ? '没有记录'
    : (d.cntDone === d.cnt ? `${d.cnt} 张 · 全部结清` : `${d.cnt} 张 · 已结清 ${d.cntDone} 张`);
  const detail = `<div class="trend-detail">

              <div class="tp-cols">${cols}</div>

      <div class="trend-stats">

        <div class="trend-stat"><div class="ts-val">${num(roundAmt(sum.total))}</div><div class="ts-label">区间总价</div></div>
        <div class="trend-stat"><div class="ts-val">${num(roundAmt(sum.unpaid))}</div><div class="ts-label">区间待付</div></div>

}
const roundAmt = n => Math.round(n);

/* ---- 玄学抽签 ----------------------------------------------------------
   看看「今天会不会有人交稿」。纯娱乐，但两件事让它不显得空：
   ① 用当天日期做种子 —— 同一天刷新一百次都是同一签，才像「今日签」，不是老虎机
   ② 除了签文再给一条现实依据（在手未完结张数、最近交付日），把玄学落回你自己的稿子 */
const FORTUNES = [
  { lv: '大吉', tone: 'great', poem: '笔走龙蛇，稿从天降', read: '灵感、手感、时间今天全齐了，就等出图。', pred: '今天交稿的概率很高，建议把消息提醒打开。' },
  { lv: '大吉', tone: 'great', poem: '云开月明，忽然而至', read: '你等的那张，作者自己比你还急。', pred: '大概率今天就有动静，而且可能不止一个人。' },
  { lv: '大吉', tone: 'great', poem: '东风解冻，万物皆动', read: '卡了很久的进度，今天会自己化开。', pred: '有稿在路上，注意查收。' },
  { lv: '吉', tone: 'good', poem: '春江水暖鸭先知', read: '已经有动静了，只是还没浮出水面。', pred: '今天可能先收到草稿，或者一句「快好了」。' },
  { lv: '吉', tone: 'good', poem: '柳暗花明又一村', read: '绕了远路，但方向是对的。', pred: '有戏，今天或明天会出结果。' },
  { lv: '吉', tone: 'good', poem: '风起于青萍之末', read: '变化已经开始了，只是还很小。', pred: '进度在动，但未必今天落到你手上。' },
  { lv: '中吉', tone: 'mid', poem: '君子藏器于身，待时而动', read: '都准备好了，还差一口气。', pred: '今天悬，别把期待拉太满。' },
  { lv: '中吉', tone: 'mid', poem: '不疾不徐，水到渠成', read: '节奏是人家自己的，催不来也丢不了。', pred: '有进度，但不会今天就交。' },
  { lv: '中吉', tone: 'mid', poem: '月满则亏，水满则溢', read: '你手上已经够多了，别再急着加。', pred: '今天适合整理已有的单子，不适合开新坑。' },
  { lv: '平', tone: 'flat', poem: '静水流深', read: '安静的一天，不代表没在往前走。', pred: '今天大概率没动静，安心做别的事。' },
  { lv: '平', tone: 'flat', poem: '但行好事，莫问前程', read: '该做的都做了，剩下的交给时间。', pred: '今天不用盯，明天再看。' },
  { lv: '平', tone: 'flat', poem: '守株待兔，不如归去', read: '刷屏不会让稿子变快。', pred: '今天没有交稿的迹象，去睡吧。' },
  { lv: '末吉', tone: 'late', poem: '欲速则不达', read: '画笔有自己的节奏，催只会让人手抖。', pred: '今天不太可能交稿，忍住别催。' },
  { lv: '末吉', tone: 'late', poem: '月有阴晴圆缺', read: '今天不在状态的是对方，不是你的运气。', pred: '今天安静，过两天再说。' }
];

/* 同一天永远同一签：拿日期当种子，顺序固定地取签文和贵人。
   和雷达一个口径：搁置（画师失联）的不参与抽签 */
function fortuneOf(dateStr) {
  const rnd = mulberry(hashStr('ykzj-' + dateStr));
  const f = FORTUNES[Math.floor(rnd() * FORTUNES.length) % FORTUNES.length];
  const inFlight = S.commissions.filter(c => !isDoneOrder(c) && !c.stalled && c.artist);
  const names = Array.from(new Set((inFlight.length ? inFlight : S.commissions.filter(c => c.artist && !c.stalled)).map(c => c.artist)));
  const lucky = names.length ? names[Math.floor(rnd() * names.length) % names.length] : '';
  return { f, lucky };
}
/* 签文下面的现实依据，让这一签和「我的稿子」有关 */
function fortuneBasis() {
  const inFlight = S.commissions.filter(c => !isDoneOrder(c));
  const active = inFlight.filter(c => !c.stalled);
  const dated = active.filter(c => c.date)
    .map(c => ({ c, d: daysFromToday(c.date) }))
    .filter(x => x.d !== null);
  /* 「最近交付」要的是还没到的最近一个；全都超期了才退而显示拖得最久的那张 */
  const upcoming = dated.filter(x => x.d >= 0).sort((a, b) => a.d - b.d)[0]
    || dated.sort((a, b) => a.d - b.d)[0];
  return { activeCount: active.length, parkedCount: inFlight.length - active.length, upcoming };
}
function countdownShort(d) {
  if (d === null) return '';
  if (d === 0) return '就是今天';
  if (d > 0) return '还有 ' + d + ' 天';
  return '已超期 ' + Math.abs(d) + ' 天';
}
function renderFortune() {
  const box = $('#fortuneBox');
  if (!box) return;
  const today = dayKey();
  const { activeCount, parkedCount, upcoming } = fortuneBasis();
  const basis = `<div class="f-basis">
      <span>📌 在手未完结 <b>${activeCount}</b> 张</span>
      ${parkedCount ? `<span>💤 另有 <b>${parkedCount}</b> 张已搁置</span>` : ''}
      ${upcoming
        ? `<span>🗓 ${upcoming.d >= 0 ? '最近交付' : '拖最久的'} <b>${fmtDate(upcoming.c.date)}</b> · ${countdownShort(upcoming.d)}</span>`
        : '<span>🗓 还没填交付日期</span>'}
    </div>`;

  if (S.prefs.drawDate !== today) {
    box.innerHTML = `<div class="fortune-card">
      <div class="f-orb">🔮</div>
      <div class="f-poem">今日交稿签</div>
      <div class="f-hint">摇一摇，看看今天会不会有人给你交稿。<br>每日一签，摇过之后今天就定了。</div>
      <button class="btn btn-primary btn-block" data-act="draw-fortune">🔮 摇一签</button>
      ${basis}
    </div>`;
    return;
  }

  const { f, lucky } = fortuneOf(today);
  box.innerHTML = `<div class="fortune-card f-reveal">
    <div class="f-orb">🔮</div>
    <div class="f-lv ${f.tone}">${f.lv}</div>
    <div class="f-poem">${f.poem}</div>
    <div class="f-read">${f.read}</div>
    <div class="f-pred">🔎 ${f.pred}</div>
    ${lucky ? `<div class="f-lucky">今日贵人 <b>${esc(lucky)}</b> · 多看一眼 TA 的进度</div>` : ''}
    ${basis}
    <div class="f-hint" style="margin:14px 0 0;">今日签已定，刷新不会变。明天再来。</div>
  </div>`;
}

/* ---- 近期动态 ----------------------------------------------------------
   两个部分回答同一个问题：「下一个交稿的是谁？」
   上半「交稿雷达」直接从现有数据推 —— 谁的在途稿件最接近交付日、谁的款已经结清就差出图；
   下半「操作流水」记录你付过的每一笔钱、打过的每一个勾，
   时间线拉长之后就能看出「谁刚收了钱，谁该出图了」。 */
function actIcon(a) {
  return { add: '📝', pay: '💸', ms: '✅', 'ms-off': '↩️', done: '🎉', undone: '↩️', del: '🗑️' }[a.type] || '•';
}
function actText(a) {
  const t = esc(a.title || '未命名');
  switch (a.type) {
    case 'add':    return `新增《${t}》${a.amount ? ' · ' + fmt(a.amount) : ''}`;
    case 'pay':    return `${a.cleared ? '付清' : '付款'}《${t}》<span class="fi-amt">${fmt(a.amount || 0)}</span>`;
    case 'ms':     return `《${t}》完成节点「${esc(a.name || '节点')}」`;
    case 'ms-off': return `《${t}》取消「${esc(a.name || '节点')}」的完成标记`;
    case 'done':   return `《${t}》已完稿 🎉`;
    case 'undone': return `《${t}》退回未完稿`;
    case 'del':    return `删除《${t}》`;
    default:       return `《${t}》`;
  }
}
function feedDayLabel(k) {
  const d = daysFromToday(k);
  if (d === 0) return '今天';
  if (d === -1) return '昨天';
  if (d === -2) return '前天';
  const p = k.split('-');
  return parseInt(p[1]) + '月' + parseInt(p[2]) + '日';
}
const hhmm = ts => { const d = new Date(ts); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };

let parkedOpen = false;   // 雷达下面「已搁置」那组是否展开

function renderFeed() {
  const box = $('#feedBox');
  if (!box) return;

  /* ① 交稿雷达
     画师失联的单子会永远挂在「超期最久」的位置，把真正该催的挤下去，
     所以给它们一个「搁置」状态：不参与排序，单独收在雷达下面 */
  const inFlight = S.commissions.filter(c => !isDoneOrder(c));
  const parked = inFlight.filter(c => c.stalled);
  const rows = inFlight.filter(c => !c.stalled)
    .map(c => ({ c, hasDate: !!c.date, d: c.date ? daysFromToday(c.date) : null }))
    .sort((a, b) => {
      const ka = a.hasDate ? a.d : 1e6, kb = b.hasDate ? b.d : 1e6;
      if (ka !== kb) return ka - kb;
      return String(a.c.month || '').localeCompare(String(b.c.month || ''));
    });

  /* 两种行的骨架一样，只是「日期」那一列的表达不同 */
  const rowHTML = (r, i) => {
    const c = r.c, rem = remainingOf(c);
    let cls = 'none', txt = c.month ? fmtMonth(c.month) + ' 内' : '未定';
    if (r.hasDate) {
      if (r.d < 0) { cls = 'over'; txt = '超期 ' + Math.abs(r.d) + ' 天'; }
      else if (r.d === 0) { cls = 'soon'; txt = '就是今天'; }
      else if (r.d <= 7) { cls = 'soon'; txt = '还有 ' + r.d + ' 天'; }
      else { cls = 'ok'; txt = '还有 ' + r.d + ' 天'; }
    }
    return `<div class="radar-row ${i === 0 ? 'top' : ''}" data-act="edit" data-id="${c.id}" data-longpress data-lp="${c.id}">
      <div class="radar-rank">${i + 1}</div>
      <div class="rr-main">
        <div class="rr-title">${esc(c.title)}</div>
        <div class="rr-sub">${esc(c.artist || '未填画师')}${c.date ? ' · 交付 ' + fmtDate(c.date) : ''}</div>
      </div>
      <div class="rr-right">
        <div class="rr-days ${cls}">${txt}</div>
        <div class="rr-amt">${rem > 0 ? '待付 ' + fmt(rem) : '已结清'}</div>
      </div>
    </div>`;
  };
  const parkedRowHTML = c => {
    const rem = remainingOf(c);
    return `<div class="radar-row" data-act="edit" data-id="${c.id}" data-longpress data-lp="${c.id}">
      <div class="radar-rank">–</div>
      <div class="rr-main">
        <div class="rr-title">${esc(c.title)}</div>
        <div class="rr-sub">${esc(c.artist || '未填画师')}${c.date ? ' · 原定 ' + fmtDate(c.date) : ''}</div>
      </div>
      <div class="rr-right">
        <div class="rr-days none">已搁置</div>
        <div class="rr-amt">${rem > 0 ? '待付 ' + fmt(rem) : '已结清'}</div>
      </div>
    </div>`;
  };

  const parkedHTML = parked.length ? `
    <button class="radar-parked-btn" data-act="toggle-parked">
      <span>💤 已搁置 ${parked.length} 张（画师失联，不计入雷达）</span>
      <span class="rp-arrow">${parkedOpen ? '收起 ▴' : '展开 ▾'}</span>
    </button>
    ${parkedOpen ? `<div class="radar-parked-list">${parked.map(parkedRowHTML).join('')}</div>` : ''}` : '';

  let radarHTML;
  if (!rows.length) {
    radarHTML = `<div class="feed-head">📡 交稿雷达<span class="fh-sub">按交付日期排</span></div>
      <div class="radar-guess">${parked.length
        ? `💤 在途的 ${parked.length} 张都被搁置了，雷达暂时安静。`
        : '🎉 手头没有在途的稿子了，雷达安静。'}</div>${parkedHTML}`;
  } else {
    const f = rows[0], fc = f.c, frem = remainingOf(fc);
    radarHTML = `
      <div class="feed-head">📡 交稿雷达<span class="fh-sub">点编辑 · 长按可搁置</span></div>
      <div class="radar-guess">🔎 下一个最可能交稿的是 <b>${esc(fc.artist || '这位画师')}</b> —— 《${esc(fc.title)}》，${
        f.hasDate
          ? `交付日 ${fmtDate(fc.date)}${f.d < 0 ? '（已超期 ' + Math.abs(f.d) + ' 天）' : ''}`
          : `计划 ${fmtMonth(fc.month)} 内`
      }，${frem > 0 ? `还差 <b>${fmt(frem)}</b> 尾款` : '款已结清，就等出图'}。</div>
      ${rows.slice(0, 8).map(rowHTML).join('')}
      ${rows.length > 8 ? `<div class="fh-sub" style="text-align:center;color:var(--text-dim);font-size:11.5px;margin-top:4px;">还有 ${rows.length - 8} 张在稿件页里</div>` : ''}
      ${parkedHTML}`;
  }

  /* ② 操作流水 */
  const acts = Array.isArray(S.activity) ? S.activity : [];
  const groups = [];
  acts.slice(0, 60).forEach(a => {
    const k = dayKey(new Date(a.at));
    const g = groups[groups.length - 1];
    if (g && g.k === k) g.items.push(a); else groups.push({ k, items: [a] });
  });

  const feedHTML = groups.length ? `<div class="feed-card">
      ${groups.map(g => `<div class="feed-day">${feedDayLabel(g.k)}</div>
        ${g.items.map(a => `<div class="feed-item">
          <div class="fi-ico">${actIcon(a)}</div>
          <div class="fi-main">
            <div class="fi-text">${actText(a)}</div>
            <div class="fi-time">${hhmm(a.at)}${a.artist ? ' · ' + esc(a.artist) : ''}</div>
          </div>
        </div>`).join('')}`).join('')}
    </div>`
    : `<div class="radar-guess" style="margin-top:16px;">📝 动态从今天开始记：新增稿件、付款、打勾验收节点、完稿、删除都会按时间记在这里。用上一阵子，你就能从「谁刚收了钱」推出「谁该出图了」。</div>`;

  box.innerHTML = radarHTML + `<div class="feed-head" style="margin-top:20px;">🕒 近期动态<span class="fh-sub">你付的钱、打过的勾</span></div>` + feedHTML;
}

function applyMsTemplate(type) {

function saveCommission() {
  const title = $('#f_title').value.trim();
  const total = parseFloat($('#f_total').value) || 0;
  if (!title) { toast('请填写稿件名称', '✏️'); $('#f_title').focus(); return; }
  if (total <= 0) { toast('请填写有效的总价', '💰'); $('#f_total').focus(); return; }
  const data = {
    id: formId || uid(),
    title,
    artist: $('#f_artist').value.trim(),
    total,
    paid: parseFloat($('#f_paid').value) || 0,
    month: $('#f_month').value || thisMonthKey(),
    date: $('#f_date').value || '',
    notes: $('#f_notes').value.trim(),
    milestones: formMs.filter(m => (m.name || '').trim() || m.done)
  };
  const idx = S.commissions.findIndex(x => x.id === data.id);
  const old = idx >= 0 ? S.commissions[idx] : null;
  if (idx >= 0) S.commissions[idx] = data; else S.commissions.push(data);

  /* 记流水：只有「新增 / 付款 / 打勾节点 / 完稿」值得记，
     改名字、改备注这类纯编辑不记，免得把动态刷成噪声 */
  if (!old) {
    logAct('add', data, { amount: data.total });
  } else {
    const dPaid = (Number(data.paid) || 0) - (Number(old.paid) || 0);
    if (dPaid > 0) logAct('pay', data, { amount: dPaid, cleared: remainingOf(data) <= 0 });
    const od = (old.milestones || []).filter(m => m.done).length;
    const doneNow = (data.milestones || []).filter(m => m.done);
    if (doneNow.length > od) {
      logAct('ms', data, { name: doneNow.slice(od).map(m => m.name || '节点').join('、') });
    }
    if (isAllDone(data) && !isAllDone(old)) logAct('done', data);
  }

  save(true);
  Sheet.close();
  renderAll();
  toast(formId ? '已保存修改' : '已添加稿件', '✅');
}
async function deleteCommission(id) {
  const c = findComm(id);
  if (!c) return;
  const ok = await confirmDialog({
    title: '删除稿件',
    message: `「${c.title}」将被永久删除，无法恢复。`,
    okText: '删除', danger: true
  });
  if (!ok) return;
  S.commissions = S.commissions.filter(x => x.id !== id);
  logAct('del', c);
  save(true);
  Sheet.close();
  renderAll();
  toast('已删除', '🗑️');
}
function cardMenu(id) {
  const c = findComm(id);
  if (!c) return;
  const finished = isDoneOrder(c);
  const items = [{ icon: '✏️', label: '编辑稿件', act: () => openCommissionForm(id) }];
  /* 已经完结的单子不再给「恢复」类操作 —— 钱收到了不会退，稿画完了不会回炉。
     真改错了，去编辑表单里改就行。 */
  if (!finished) items.push({ icon: '✅', label: '标记为已完成', act: () => completeCommission(id) });
  /* 画师失联的单子会一直顶在雷达最前面，把真正该催的挤下去 —— 给个「先放一边」的开关 */
  if (!finished) items.push({
    icon: c.stalled ? '📡' : '💤',
    label: c.stalled ? '恢复参与交稿雷达' : '画师失联，先放一边',
    act: () => toggleStalled(id)
  });
  items.push({ icon: '🗑️', label: '删除稿件', danger: true, act: () => deleteCommission(id) });
  actionSheet({ title: c.title, items });
}
/* 搁置 / 恢复：只影响「交稿雷达」的排序和抽签，钱和状态都不动 */
function toggleStalled(id) {
  const c = findComm(id);
  if (!c) return;
  c.stalled = !c.stalled;
  logAct(c.stalled ? 'stall' : 'unstall', c);
  save(true);
  renderAll();
  toast(c.stalled ? '已搁置，不再参与交稿雷达' : '已恢复，重新参与交稿雷达', c.stalled ? '💤' : '📡');
}
/* 一键完结：钱结清 + 所有验收节点打勾 */
function completeCommission(id) {
  const c = findComm(id);
  if (!c) return;
  c.paid = Number(c.total) || 0;
  /* 没设过验收节点的话补一个 —— 否则「完稿」这个状态就没有依据，
     卡片会一直停在「已结清，绘制中」，总览页也退不掉 */
  if (!c.milestones || !c.milestones.length) c.milestones = [{ name: '已完成', done: true }];
  else c.milestones.forEach(m => m.done = true);
  save(true);
  renderAll();
  toast('已标记为已完成 🎉', '✅');
}
function toggleMS(id, idx) {
  const c = findComm(id);
  if (!c || !c.milestones || !c.milestones[idx]) return;
  const m = c.milestones[idx];
  const wasDone = isAllDone(c);
  m.done = !m.done;
  logAct(m.done ? 'ms' : 'ms-off', c, { name: m.name || '节点' });
  /* 打勾的是最后一个节点的话，这一下就等于完稿了，单独再记一笔 */
  const nowDone = isAllDone(c);
  if (nowDone && !wasDone) logAct('done', c);
  else if (!nowDone && wasDone) logAct('undone', c);
  save();
  haptic();
  renderAll();
}

function encodeData() {

    activity: S.activity, exportedAt: new Date().toISOString()

}

    <div class="kv"><span class="k">保送卡</span><span class="v">${S.guarantees.length} 条</span></div>

    <div class="divider"></div>
    <div class="form-group"><label>导出备份</label>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-ghost btn-sm" style="flex:1;" data-act="copy-backup">📋 复制</button>
        <button class="btn btn-ghost btn-sm" style="flex:1;" data-act="share-backup">📤 分享</button>
        <button class="btn btn-ghost btn-sm" style="flex:1;" data-act="download-backup">⬇ 下载</button>
      </div>
      <div class="sheet-note" style="margin-top:8px;">复制后存到备忘录或发给自己，换手机时粘回来即可。</div>
    </div>
    <div class="form-group"><label>粘贴备份数据恢复</label>
      <textarea class="form-textarea" id="importText" placeholder="粘贴之前复制的备份数据..." style="min-height:90px;"></textarea></div>
    <div class="spacer"></div>`;
  const footer = `<button class="btn btn-ghost" data-act="close-sheet">关闭</button>
                  <button class="btn btn-primary" data-act="import-backup">恢复数据</button>`;
  Sheet.open({ title: '📦 数据备份与恢复', body, footer });
  Sheet.el._backup = encoded;
}
async function copyBackup() {
  const text = Sheet.el._backup || encodeData();
  try {
    await navigator.clipboard.writeText(text);
    toast('已复制，去粘贴保存吧', '📋');
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
    toast('已复制', '📋');
  }
}
async function shareBackup() {
  const text = Sheet.el._backup || encodeData();
  if (navigator.share) {
    try { await navigator.share({ title: '约稿管家备份', text }); } catch (e) {}
  } else { copyBackup(); }
}
function downloadBackup() {
  const text = Sheet.el._backup || encodeData();
  const blob = new Blob([text], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '约稿管家备份-' + new Date().toISOString().slice(0, 10) + '.txt';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  toast('已下载备份文件', '⬇️');
}
async function importBackup() {
  const text = ($('#importText').value || '').trim();
  if (!text) { toast('请先粘贴备份数据', '📋'); return; }
  let data;
  try {
    data = JSON.parse(decodeURIComponent(escape(atob(text))));
  } catch (e) { toast('数据格式不对，检查是否复制完整', '⚠️'); return; }
  const ok = await confirmDialog({ title: '恢复数据', message: '恢复会覆盖当前全部数据，确定继续？', okText: '覆盖恢复', danger: true });
  if (!ok) return;
  if (Array.isArray(data)) {
    S.commissions = data.map(normalizeComm).filter(Boolean);
  } else if (data && data.commissions) {
    S.commissions = (data.commissions || []).map(normalizeComm).filter(Boolean);
    S.guarantees = (data.guarantees || []).map(normalizeGuarantee).filter(Boolean);
    S.wishes = (data.wishes || []).map(normalizeWish).filter(Boolean);
    S.dates = Array.isArray(data.dates) ? data.dates.filter(x => x && x.name && x.date) : [];
    /* 老备份里没有动态这一项，这时保留现有的，别把人家的流水洗掉 */
    if (Array.isArray(data.activity)) S.activity = data.activity.filter(a => a && a.at);
  } else { toast('无法识别的备份格式', '⚠️'); return; }
  save(true);
  Sheet.close();
  renderAll();
  toast('已恢复 ' + S.commissions.length + ' 条稿件', '✅');
}

  return window.navigator.standalone === true ||

function detectPlatform() {
  const ua = navigator.userAgent;
  const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/.test(ua);
  const isSafari = /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|Chrome|MicroMessenger|QQBrowser/.test(ua);
  const inWeChat = /MicroMessenger/i.test(ua);
  const m = ua.match(/OS (\d+)[_.]/);
  const iosMajor = (isIOS && m) ? parseInt(m[1]) : 0;
  return { isIOS, isAndroid, isSafari, inWeChat, iosMajor, desktop: !isIOS && !isAndroid };
}

function renderA2HSBanner() {
  const slot = $('#a2hsSlot');
  const p = detectPlatform();
  const dismissed = S.prefs.a2hsDismissed || 0;
  const recent = Date.now() - dismissed < 7 * 24 * 3600 * 1000;
  if (isStandalone() || recent || !(p.isIOS || p.isAndroid)) { slot.innerHTML = ''; return; }
  slot.innerHTML = `
    <div class="a2hs-banner" data-act="open-a2hs">
      <span class="ab-ico">📲</span>
      <span class="ab-txt">添加到主屏幕，像 App 一样用</span>
      <button class="ab-close" data-act="dismiss-a2hs" aria-label="不再提示">✕</button>
    </div>`;
}

async function wipeAll() {
  const ok = await confirmDialog({
    title: '清空所有数据',
    message: '将删除全部稿件、保送卡和饼，且无法恢复。建议先做一次备份。',
    okText: '全部清空', danger: true
  });
  if (!ok) return;
  const theme = S.prefs.theme, view = S.prefs.view;
  S = freshState();
  S.prefs.theme = theme; S.prefs.view = view;
  save(true);
  Sheet.close();
  renderAll();
  toast('已清空', '🗑️');
}

/* =========================================================================
   17. 事件委托
   ========================================================================= */
const ACTIONS = {
  nav: el => {
    const v = el.dataset.view;
    haptic();
    if (S.prefs.view === v) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }  // 再点一次回到顶部
    go(v);
  },
  add: () => openCommissionForm(''),
  edit: el => openCommissionForm(el.dataset.id),
  'card-menu': el => cardMenu(el.dataset.id),
  ms: el => toggleMS(el.dataset.id, parseInt(el.dataset.idx)),
  'toggle-month': el => toggleMonth(el.dataset.id),
  'toggle-month-order': () => {
    S.prefs.monthOrder = isMonthAsc() ? 'desc' : 'asc';
    save(true);
    renderDashboard();
    haptic();
    toast(isMonthAsc() ? '已按月份从早到晚排列' : '已按月份从晚到早排列', '↕️');
  },
  filter: el => { listFilter = el.dataset.id; renderList(); haptic(); },
  'toggle-hide-done': () => {
    S.prefs.hideDone = !S.prefs.hideDone;
    save(true);
    renderList();
    haptic();
    toast(S.prefs.hideDone ? '已隐藏已完成的稿件' : '已显示全部稿件', S.prefs.hideDone ? '🙈' : '👁');
  },
  'prev-month': () => { currentMonth.setMonth(currentMonth.getMonth() - 1); renderSchedule(); },
  'next-month': () => { currentMonth.setMonth(currentMonth.getMonth() + 1); renderSchedule(); },
  'this-month': () => { currentMonth = new Date(); renderSchedule(); },
  'quick-pick': el => {
    const c = findComm(el.dataset.id);
    if (!c) return;
    $('#calcTotal').value = c.total;
    if (!$('#calcPlatform').value) $('#calcPlatform').value = 50;
    calcOffline(); haptic();
  },
  lab: el => switchLab(el.dataset.lab),
  'open-lab-order': () => openLabOrder(),
  'lab-order': el => moveLabOrder(el.dataset.id, parseInt(el.dataset.dir)),
  'reset-lab-order': () => {
    S.prefs.labOrder = null;                       // null = 用默认顺序
    save(true);
    renderOrderList();
    renderSegControl();
    haptic();
    toast('已恢复默认顺序', '↩️');
  },
  'toggle-parked': () => { parkedOpen = !parkedOpen; renderFeed(); haptic(); },
  'toggle-stalled': el => toggleStalled(el.dataset.id),
  'draw-fortune': () => {
    if (S.prefs.drawDate === dayKey()) { renderFortune(); return; }
    S.prefs.drawDate = dayKey();
    save(true);
    haptic(16);
    const orb = $('#fortuneBox .f-orb');
    if (orb) orb.classList.add('shake');            // 先摇签筒，再开签
    setTimeout(() => { renderFortune(); toast('今日签已出 🔮', '🔮'); }, 460);
  },
  'trend-range': el => { S.prefs.trendRange = el.dataset.id; save(true); renderTrend(); haptic(); },
  'trend-metric': el => { S.prefs.trendMetric = el.dataset.id; save(true); renderTrend(); haptic(); },
  'trend-pick': el => {
    /* 重绘会把横向滚动位置重置，先记下来再还回去 */
    const sc = $('#trendChart .tp-scroll');
    const sl = sc ? sc.scrollLeft : 0;
    trendSel = el.dataset.id;
    renderTrend();
    const sc2 = $('#trendChart .tp-scroll');
    if (sc2) sc2.scrollLeft = sl;
    haptic();
  },
  'add-guarantee': () => openLabForm('guarantee'),
  'add-wish': () => openLabForm('wish'),
  'add-date': () => openDateForm(''),
  'edit-date': el => openDateForm(el.dataset.id),
  'del-date': el => deleteDate(el.dataset.id),
  'save-date': () => saveDateForm(),
  'edit-guarantee': el => openLabForm('guarantee', el.dataset.id),
  'edit-wish': el => openLabForm('wish', el.dataset.id),
  'toggle-guarantee': el => {
    const g = S.guarantees.find(x => x.id === el.dataset.id);
    if (!g) return;
    g.done = !g.done; save(true); renderGuarantee(); haptic();
  },
  'toggle-wish': el => {
    const w = S.wishes.find(x => x.id === el.dataset.id);
    if (!w) return;
    w.done = !w.done; save(true); renderWishes(); haptic();
  },
  'del-guarantee': el => deleteLab('guarantee', el.dataset.id),
  'del-wish': el => deleteLab('wish', el.dataset.id),
  'ms-tpl': el => applyMsTemplate(el.dataset.id),
  'ms-add': () => { formMs.push({ name: '', done: false }); renderMsEditor(); },

  'open-settings': () => openSettings(),
  'open-about': () => openAbout(),
  'open-backup': () => openBackupSheet(),
  'open-a2hs': () => openA2HSGuide(),

  'dismiss-a2hs': () => { S.prefs.a2hsDismissed = Date.now(); save(true); $('#a2hsSlot').innerHTML = ''; },
  'copy-backup': () => copyBackup(),
  'share-backup': () => shareBackup(),
  'download-backup': () => downloadBackup(),
  'import-backup': () => importBackup(),
  wipe: () => wipeAll()
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = ACTIONS[el.dataset.act];
  if (!fn) return;
  if (el.dataset.act === 'card-menu' || el.dataset.act === 'ms' || el.dataset.act === 'dismiss-a2hs') e.stopPropagation();
  fn(el, e);
});

/* 长按卡片 → 快捷操作 */
let lpTimer = null, lpStart = null, lpFired = false;
document.addEventListener('touchstart', e => {
  const card = e.target.closest('[data-longpress]');
  if (!card) return;
  const t = e.touches[0];
  lpStart = { x: t.clientX, y: t.clientY };
  lpFired = false;
  clearTimeout(lpTimer);
  lpTimer = setTimeout(() => {
    lpFired = true;
    haptic(18);
    cardMenu(card.dataset.lp);
  }, 480);
}, { passive: true });
document.addEventListener('touchmove', e => {
  if (!lpTimer || !lpStart) return;
  const t = e.touches[0];
  if (Math.abs(t.clientX - lpStart.x) > 8 || Math.abs(t.clientY - lpStart.y) > 8) {
    clearTimeout(lpTimer); lpTimer = null;
  }
}, { passive: true });
document.addEventListener('touchend', e => {
  clearTimeout(lpTimer); lpTimer = null;
  if (lpFired) { lpFired = false; e.preventDefault(); }
});
document.addEventListener('touchcancel', () => { clearTimeout(lpTimer); lpTimer = null; });

/* 输入联动 */
function bindInputs() {
  $('#searchInput').addEventListener('input', onSearch);
  $('#calcTotal').addEventListener('input', calcOffline);
  $('#calcPlatform').addEventListener('input', calcOffline);
  ['pr_salary', 'pr_other_income', 'pr_other_expense'].forEach(id => {
    $('#' + id).addEventListener('input', calcPressure);
  });
  $('#pr_tail').addEventListener('input', e => { e.target.dataset.touched = '1'; calcPressure(); });
  bindSegRail();
}

/* 表单内输入（节点名称 / 勾选）委托 */
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.msName !== undefined) {
    const i = parseInt(t.dataset.msName);
    if (formMs[i]) formMs[i].name = t.value;
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.msDone !== undefined) {
    const i = parseInt(t.dataset.msDone);
    if (formMs[i]) formMs[i].done = t.checked;
  }
});

/* 顶栏滚动阴影 */
window.addEventListener('scroll', () => {
  $('#topBar').classList.toggle('scrolled', window.scrollY > 6);
}, { passive: true });

/* 键盘 & 手势 */
document.addEventListener('keydown', e => { if (e.key === 'Escape') { Sheet.close(); $('#dialogLayer').classList.remove('show'); } });
['gesturestart', 'gesturechange', 'gestureend'].forEach(ev =>
  document.addEventListener(ev, e => e.preventDefault(), { passive: false }));

/* 图标 + PWA 元数据 */
function setupPWA() {
  if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
  try {
    const ic = ICONS.p512 || ($('link[rel="apple-touch-icon"]') || {}).href || '';
    const ic192 = ICONS.p192 || ic;
    const base = location.href.replace(/[^/]*$/, '');
    const manifest = {
      name: '约稿尾款管家', short_name: '约稿管家',
      start_url: location.href, scope: base,
      display: 'standalone', orientation: 'portrait',
      background_color: '#f2f2f7', theme_color: '#f2f2f7', lang: 'zh-CN',
      icons: ic ? [
        { src: ic192, sizes: '192x192', type: 'image/png', purpose: 'any' },
        { src: ic, sizes: '512x512', type: 'image/png', purpose: 'any' },
        { src: ic, sizes: '512x512', type: 'image/png', purpose: 'maskable' }
      ] : []
    };
    const url = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' }));
    let link = $('link[rel="manifest"]');
    if (!link) { link = document.createElement('link'); link.rel = 'manifest'; document.head.appendChild(link); }
    link.href = url;
  } catch (e) {}
}

/* =========================================================================
   18. 启动
   ========================================================================= */
function emptyState(icon, title, sub, act, btnText) {
  return `<div class="empty-state">
    <div class="icon">${icon}</div>
    <p>${esc(title)}</p>
    ${sub ? `<div class="es-sub">${esc(sub)}</div>` : ''}
    ${act ? `<button class="btn btn-primary btn-sm" data-act="${act}">${esc(btnText)}</button>` : ''}
  </div>`;
}

function init() {
  applyTheme(S.prefs.theme || 'light');
  bindInputs();
  go(S.prefs.view || 'dashboard');
  setupPWA();
  // 从旧版升级上来的用户：明确告诉他们数据还在
  if (MIGRATED > 0) setTimeout(() => toast('已从旧版导入 ' + MIGRATED + ' 条记录', '📦'), 700);
  // 首次使用引导
  if (!S.prefs.seen) {
    S.prefs.seen = 1; save(true);
    setTimeout(() => toast('长按卡片可以快速结清或删除', '💡'), MIGRATED > 0 ? 3200 : 900);
  }
}
init();
